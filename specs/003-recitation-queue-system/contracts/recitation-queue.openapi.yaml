openapi: 3.0.3
info:
  title: Halaqaty F-003 Recitation Queue Contract
  version: 1.0.0
  description: Additive `/api/v1` queue surface. Canonical source is `docs/contracts/openapi.yaml`.
  contact:
    name: Halaqaty
    url: https://halaqaty.app
servers:
  - url: https://api.halaqaty.app/api/v1
security:
  - BearerAuth: []
    SessionId: []
tags:
  - name: Queue
paths:
  /sessions/{sessionId}/queue:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getSessionQueue
      tags: [Queue]
      summary: Get the authoritative current queue snapshot
      description: Returns the PostgreSQL-authoritative, visibility-filtered current queue snapshot.
      responses:
        '200':
          description: Visibility-filtered queue snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueState'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /sessions/{sessionId}/queue/rounds:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: createQueueRound
      tags: [Queue]
      summary: Prepare or immediately activate a sequential round
      description: Prepares a round for a scheduled session or creates and activates one for an active session.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoundRequest' }
      responses:
        '201':
          description: Round prepared or activated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /sessions/{sessionId}/queue/reset:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: resetSessionQueue
      tags: [Queue]
      summary: Finalize the current round and create the next round
      description: Retains the prior round under the session finalization policy and creates the next sequential round.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetQueueRequest' }
      responses:
        '201':
          description: Prior round finalized and new round created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /sessions/{sessionId}/queue/advance:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: advanceSessionQueue
      tags: [Queue]
      summary: Select the next waiting entry without starting it
      description: Durably selects the next waiting entry; starting recitation remains a separate transition.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionRequest' }
      responses:
        '200':
          description: Next waiting entry selected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /sessions/{sessionId}/queue/order:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    put:
      operationId: reorderSessionQueue
      tags: [Queue]
      summary: Replace the order of all reorderable entries or pre-set candidates
      description: Replaces the complete reorderable order under one optimistic round version.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderQueueRequest' }
      responses:
        '200':
          description: Queue reordered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /sessions/{sessionId}/queue/entries/{entryId}/status:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/EntryId'
    put:
      operationId: updateQueueEntryStatus
      tags: [Queue]
      summary: Start, skip, or complete an entry using an allowed transition
      description: Applies an allowed transition and atomically writes completed-only progress.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntryStatusRequest' }
      responses:
        '200':
          description: Entry transitioned and queue snapshot returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/MediaUnavailable' }

  /sessions/{sessionId}/queue/entries/{entryId}/grade:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: gradeQueueEntry
      tags: [Queue]
      summary: Correct the grade or note of a completed entry when policy permits
      description: Updates the existing completed entry and its one progress record atomically.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GradeCorrectionRequest' }
      responses:
        '200':
          description: Existing entry and its single progress record updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /sessions/{sessionId}/queue/opt-out:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: optOutOfQueue
      tags: [Queue]
      summary: Request or automatically receive opt-out under session policy
      description: Creates a pending request or an automatic approved outcome according to session policy.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Existing idempotent request/outcome
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OptOutResult' }
        '201':
          description: Request/outcome created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OptOutResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /sessions/{sessionId}/queue/opt-out-requests/{requestId}/decision:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/RequestId'
    post:
      operationId: decideQueueOptOutRequest
      tags: [Queue]
      summary: Approve or decline a pending student opt-out request
      description: Allows a current teacher or supervisor to decide one pending request.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptOutDecisionRequest' }
      responses:
        '200':
          description: Request decided and queue outcome returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OptOutResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/MediaUnavailable' }

  /sessions/{sessionId}/queue/policy:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    patch:
      operationId: updateSessionQueuePolicy
      tags: [Queue]
      summary: Change closed queue policy values prospectively
      description: Updates closed values for subsequent actions without rewriting durable history.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueuePolicyPatch' }
      responses:
        '200':
          description: Current policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueuePolicy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase JWT
    SessionId:
      type: apiKey
      in: header
      name: X-Halaqaty-Session-ID
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EntryId:
      name: entryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional opaque key (1-128 characters); reuse with another command is a conflict.
      schema: { type: string, minLength: 1, maxLength: 128 }
  responses:
    BadRequest: { description: Malformed request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Unauthorized: { description: Missing or invalid current credentials, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Forbidden: { description: Current membership or role is insufficient, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: 'Session, round, entry, or request not found', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: 'Stale version, invalid state transition, duplicate command conflict, or invariant conflict', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    ValidationError: { description: 'Invalid Quran range, enum, order, grade, or note', content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }
    RateLimited: { description: REST rate limit exceeded, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    MediaUnavailable: { description: Queue truth committed or retained but reciter audio convergence is temporarily unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  schemas:
    RoundRequest:
      type: object
      additionalProperties: false
      required: [round_type, surah_id, from_ayah, to_ayah, grading_required]
      properties:
        round_type: { type: string, enum: [new_memorization, revision, old_revision, test] }
        surah_id: { type: integer, minimum: 1, maximum: 114 }
        from_ayah: { type: integer, minimum: 1 }
        to_ayah: { type: integer, minimum: 1 }
        grading_required: { type: boolean }
        student_order:
          type: array
          uniqueItems: true
          maxItems: 50
          items: { type: string, format: uuid }
    ResetQueueRequest:
      type: object
      additionalProperties: false
      required: [round_type, surah_id, from_ayah, to_ayah, grading_required, expected_version]
      properties:
        round_type: { type: string, enum: [new_memorization, revision, old_revision, test] }
        surah_id: { type: integer, minimum: 1, maximum: 114 }
        from_ayah: { type: integer, minimum: 1 }
        to_ayah: { type: integer, minimum: 1 }
        grading_required: { type: boolean }
        student_order:
          type: array
          uniqueItems: true
          maxItems: 50
          items: { type: string, format: uuid }
        expected_version: { type: integer, format: int64, minimum: 1 }
    VersionRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
    ReorderQueueRequest:
      type: object
      additionalProperties: false
      required: [order_kind, ordered_ids, expected_version]
      properties:
        order_kind: { type: string, enum: [preorder_students, queue_entries] }
        ordered_ids:
          type: array
          uniqueItems: true
          maxItems: 50
          items: { type: string, format: uuid }
        expected_version: { type: integer, format: int64, minimum: 1 }
    EntryStatusRequest:
      type: object
      additionalProperties: false
      required: [status, expected_entry_version]
      properties:
        status: { type: string, enum: [reciting, skipped, completed] }
        expected_entry_version: { type: integer, format: int64, minimum: 1 }
        grade: { $ref: '#/components/schemas/Grade' }
        notes: { type: string, maxLength: 500, nullable: true }
      description: Grade is required with completed when the round requires grading; grade/notes are invalid for reciting or skipped.
    GradeCorrectionRequest:
      type: object
      additionalProperties: false
      required: [expected_entry_version]
      properties:
        grade: { $ref: '#/components/schemas/Grade' }
        notes: { type: string, maxLength: 500, nullable: true }
        expected_entry_version: { type: integer, format: int64, minimum: 1 }
      minProperties: 2
    OptOutDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, expected_entry_version]
      properties:
        decision: { type: string, enum: [approved, declined] }
        expected_entry_version: { type: integer, format: int64, minimum: 1 }
    QueuePolicyPatch:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        population: { type: string, enum: [present_at_activation, all_active_students] }
        unfinished_finalization: { type: string, enum: [mark_unfinished_skipped, preserve_last_state] }
        opt_out: { type: string, enum: [approval_required, auto_approve] }
        grade_visibility: { type: string, enum: [managers_and_student, managers_only, all_participants] }
        grade_correction: { type: string, enum: [audited_any_time, before_round_finalization, immutable] }
        expected_version: { type: integer, format: int64, minimum: 1 }
      minProperties: 2
    QueuePolicy:
      type: object
      required: [population, unfinished_finalization, opt_out, grade_visibility, grade_correction, version]
      properties:
        population: { type: string, enum: [present_at_activation, all_active_students] }
        unfinished_finalization: { type: string, enum: [mark_unfinished_skipped, preserve_last_state] }
        opt_out: { type: string, enum: [approval_required, auto_approve] }
        grade_visibility: { type: string, enum: [managers_and_student, managers_only, all_participants] }
        grade_correction: { type: string, enum: [audited_any_time, before_round_finalization, immutable] }
        version: { type: integer, format: int64, minimum: 1 }
    Grade:
      type: string
      enum: [excellent, good, acceptable, needs_review, repeat]
      nullable: true
    QueueEntry:
      type: object
      required: [id, student_id, student_name, position, status, version]
      properties:
        id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        student_name: { type: string }
        position: { type: integer, minimum: 1 }
        status: { type: string, enum: [waiting, reciting, completed, skipped, opted_out] }
        grade: { $ref: '#/components/schemas/Grade' }
        grade_notes: { type: string, maxLength: 500, nullable: true }
        version: { type: integer, format: int64, minimum: 1 }
    QueuePreorderItem:
      type: object
      required: [student_id, student_name, position]
      properties:
        student_id: { type: string, format: uuid }
        student_name: { type: string }
        position: { type: integer, minimum: 1 }
    QueueState:
      type: object
      required: [session_id, round_id, round_number, round_type, lifecycle, surah_id, from_ayah, to_ayah, grading_required, version, policy, preorder, entries]
      properties:
        session_id: { type: string, format: uuid }
        round_id: { type: string, format: uuid }
        round_number: { type: integer, minimum: 1 }
        round_type: { type: string, enum: [new_memorization, revision, old_revision, test] }
        lifecycle: { type: string, enum: [prepared, active, finalized] }
        surah_id: { type: integer, minimum: 1, maximum: 114 }
        from_ayah: { type: integer, minimum: 1 }
        to_ayah: { type: integer, minimum: 1 }
        grading_required: { type: boolean }
        selected_entry_id: { type: string, format: uuid, nullable: true }
        version: { type: integer, format: int64, minimum: 1 }
        policy: { $ref: '#/components/schemas/QueuePolicy' }
        preorder:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/QueuePreorderItem' }
        entries:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/QueueEntry' }
    OptOutRequest:
      type: object
      required: [id, queue_entry_id, status, requested_at]
      properties:
        id: { type: string, format: uuid }
        queue_entry_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, approved, declined] }
        requested_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time, nullable: true }
    OptOutResult:
      type: object
      required: [request, entry]
      properties:
        request: { $ref: '#/components/schemas/OptOutRequest' }
        entry: { $ref: '#/components/schemas/QueueEntry' }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    ValidationError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
