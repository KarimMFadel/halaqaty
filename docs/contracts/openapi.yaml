      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryStatusRequest'
      responses:
        '200':
          description: Allowed transition committed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueState'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /sessions/{sessionId}/queue/opt-out-requests/{requestId}/decision:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/RequestId'
    post:
      operationId: decideQueueOptOutRequest
      tags: [Queue]
      summary: Approve or decline a pending opt-out request
      description: A current teacher or supervisor decides a pending request without adding a queue-entry state.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptOutDecisionRequest'
      responses:
        '200':
          description: Request decided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptOutResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /sessions/{sessionId}/queue/policy:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    patch:
      operationId: updateSessionQueuePolicy
      tags: [Queue]
      summary: Change closed queue policy values prospectively
      description: Updates one or more closed policy values for subsequent actions without rewriting queue history.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
