name: Tests (Unit & Integration)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  detect-test-targets:
    runs-on: ubuntu-latest
    outputs:
      go_enabled: ${{ steps.detect.outputs.go_enabled }}
      flutter_enabled: ${{ steps.detect.outputs.flutter_enabled }}
      flutter_unit_enabled: ${{ steps.detect.outputs.flutter_unit_enabled }}
      flutter_integration_enabled: ${{ steps.detect.outputs.flutter_integration_enabled }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect available stacks and test folders
        id: detect
        shell: bash
        run: |
          # Monorepo layout: backend/go.mod, mobile/pubspec.yaml
          if [[ -f "backend/go.mod" ]]; then
            echo "go_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "go_enabled=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -f "mobile/pubspec.yaml" ]]; then
            echo "flutter_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "flutter_enabled=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -d "mobile/test" ]]; then
            echo "flutter_unit_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "flutter_unit_enabled=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -d "mobile/integration_test" ]]; then
            echo "flutter_integration_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "flutter_integration_enabled=false" >> "$GITHUB_OUTPUT"
          fi

  go-unit-tests:
    needs: detect-test-targets
    if: needs.detect-test-targets.outputs.go_enabled == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run Go unit tests
        run: go test -short ./...

  go-integration-tests:
    needs: detect-test-targets
    if: needs.detect-test-targets.outputs.go_enabled == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: halaqaty
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d halaqaty"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/halaqaty?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run Go integration tests
        run: go test -tags=integration ./...

  flutter-unit-tests:
    needs: detect-test-targets
    if: needs.detect-test-targets.outputs.flutter_enabled == 'true' && needs.detect-test-targets.outputs.flutter_unit_enabled == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Run Flutter unit/widget tests
        run: flutter test test

  flutter-integration-tests:
    needs: detect-test-targets
    if: needs.detect-test-targets.outputs.flutter_enabled == 'true' && needs.detect-test-targets.outputs.flutter_integration_enabled == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux desktop dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libgtk-3-dev libblkid-dev liblzma-dev libsecret-1-dev xvfb
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Enable linux desktop test target
        run: flutter create . --platforms linux --no-pub
      - name: Run Flutter integration tests
        run: |
          set -o pipefail
          mkdir -p build/integration-logs
          status=0
          for test_file in integration_test/*_test.dart; do
            # Native screenshot capture is covered by the Android job below.
            case "$test_file" in
              integration_test/ux_visual_journey_test.dart|integration_test/wave0_shell_visual_test.dart|integration_test/wave1_circles_visual_test.dart|integration_test/wave2_sessions_visual_test.dart) continue ;;
            esac
            echo "::group::$test_file"
            xvfb-run -a flutter test "$test_file" -d linux --reporter expanded 2>&1 | tee "build/integration-logs/$(basename "$test_file" .dart).log" || status=1
            echo "::endgroup::"
          done
          exit "$status"
      - name: Upload functional test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-integration-linux-logs
          path: mobile/build/integration-logs/

  flutter-visual-tests:
    needs: detect-test-targets
    if: needs.detect-test-targets.outputs.flutter_enabled == 'true' && needs.detect-test-targets.outputs.flutter_integration_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite:
          - ux_visual_journey
          - wave0_shell_visual
          - wave1_circles_visual
          - wave2_sessions_visual
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Prepare fixture-only Android build
        run: |
          mkdir -p build/visual-artifacts/screenshots
          # Non-production placeholders: these suites override auth/data providers.
          # No real Firebase project or credentials are used by this job.
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "demo-halaqaty-visual"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef",
                "android_client_info": {"package_name": "com.halaqaty.mobile"}
              },
              "api_key": [{"current_key": "visual-test-placeholder-not-a-real-key"}]
            }],
            "configuration_version": "1"
          }
          JSON
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android screenshot suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          working-directory: mobile
          script: |
            drive_status=0
            flutter drive --driver=test_driver/ci_screenshot_driver.dart --target=integration_test/${{ matrix.suite }}_test.dart -d emulator-5554 > build/visual-artifacts/test.log 2>&1 || drive_status=$?
            cat build/visual-artifacts/test.log
            adb devices -l > build/visual-artifacts/adb-devices.txt 2>&1 || true
            adb -s emulator-5554 logcat -b main -b system -b crash -t 3000 -d -v threadtime > build/visual-artifacts/emulator-logcat.txt 2>&1 || true
            adb -s emulator-5554 shell dumpsys meminfo > build/visual-artifacts/emulator-memory.txt 2>&1 || true
            exit "$drive_status"
      - name: Upload screenshots and test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-visual-${{ matrix.suite }}
          path: mobile/build/visual-artifacts/
