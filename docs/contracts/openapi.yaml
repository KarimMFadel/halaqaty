        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /sessions/{sessionId}/queue/entries/{entryId}/status:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/EntryId'
    put:
      operationId: updateQueueEntryStatus
      tags: [Queue]
      summary: Start, skip, or atomically complete an entry
      description: Applies only the documented state transitions; completed-only progress is written in the same transaction.
      parameters:
