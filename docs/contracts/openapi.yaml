openapi: 3.0.3
info:
  title: Halaqaty API
  description: |
    REST API for the Halaqaty Quran memorization circle management platform.

    **Authentication:** Flutter uses Firebase Auth for sign-up, sign-in, password
    management, and ID-token refresh. API requests require a Firebase ID token in
    `Authorization: Bearer <token>` and, after backend session creation, the opaque
    current-device session identifier in `X-Halaqaty-Session-ID`. The backend never
    accepts passwords or issues Firebase ID or refresh tokens.

    **Base URL:** `https://api.halaqaty.app/api/v1`

    **WebSocket:** Real-time events (queue, session, chat) are delivered over WebSocket. See [ws_events.md](ws_events.md) for the full event catalogue.
  version: 1.0.0
  contact:
    name: Halaqaty
    url: https://halaqaty.app

servers:
  - url: https://api.halaqaty.app/api/v1
    description: Production
  - url: https://staging.api.halaqaty.app/api/v1
    description: Staging
  - url: http://localhost:8080/api/v1
    description: Local development

security:
  - BearerAuth: []
    SessionId: []

tags:
  - name: Auth
    description: User registration, profile, and device management
  - name: Circles
    description: Circle (halaqah) CRUD and membership
  - name: Sessions
    description: Live session management
  - name: Queue
    description: Recitation queue within a session
  - name: Chat
    description: Circle and direct messages
  - name: Schedules
    description: Weekly recurring schedules
  - name: Progress
    description: Student progress tracking — attendance history, Quran map, recitation stats (F-007)
  - name: Config
    description: Feature flags and application configuration
  - name: Uploads
    description: File uploads to MinIO (avatars, voice notes, images, PDFs)

# ─────────────────────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────────────────────
paths:

  # ── Auth ──────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: registerUser
      tags: [Auth]
      summary: Create user profile after Firebase registration
      security:
        - BearerAuth: []
      description: |
        Called after a successful Firebase Auth sign-up to provision the local user
        record and create a backend session for this device. The Firebase UID is
        derived solely from the verified bearer token; it is never accepted in the
        request body. Idempotent for the same Firebase identity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User provisioned and current-device backend session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: User already exists (idempotent — returns current session)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendSessionResponse'

  /auth/sessions:
    post:
      operationId: createBackendSession
      description: |
        Creates a backend session for the current device after the Flutter Firebase
        SDK has signed the user in. This endpoint does not validate a password,
        create Firebase identities, or return Firebase tokens. Clients must not
        automatically retry this request because each successful call creates a
        distinct backend device session.
      tags: [Auth]
      summary: Create a current-device backend session
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBackendSessionRequest'
      responses:
        '200':
          description: Current-device backend session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      operationId: logoutUser
      tags: [Auth]
      summary: Logout current session
      description: |
        Invalidates only the backend session identified by `X-Halaqaty-Session-ID`.
        Other device sessions remain valid. The Flutter client must also call
        Firebase sign-out locally; Firebase refresh-token rotation and reuse
        detection remain Firebase-managed.
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/fcm-token:
    post:
      operationId: registerFcmToken
      tags: [Auth]
      summary: Register or update a device FCM token (upsert by user_id + token)
      description: |
        Registers a new device FCM token for push notifications. Uses upsert
        semantics — if the token already exists for this user, updates `last_seen_at`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token:
                  type: string
                  description: FCM device registration token
                platform:
                  type: string
                  enum: [ios, android, web]
                device_name:
                  type: string
                  maxLength: 100
                  description: Optional human-readable device label
      responses:
        '200':
          description: Token registered or updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      operationId: getCurrentUser
      description: Get current user profile
      tags: [Auth]
      summary: Get current user profile
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: updateCurrentUser
      description: Update profile (name, avatar, language)
      tags: [Auth]
      summary: Update profile (name, avatar, language)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteCurrentUser
      tags: [Auth]
      summary: Delete account and all associated data
      description: |
        Permanently deletes the account, all circles owned by the user (archiving
        them for members), all messages sent by the user, and all progress records.
        This operation is irreversible and GDPR-compliant.
      responses:
        '204':
          description: Account deleted
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Circles ───────────────────────────────────────────────
  /circles:
    get:
      operationId: listCircles
      description: List circles the authenticated user is a member of
      tags: [Circles]
      summary: List circles the authenticated user is a member of
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [teacher, student, supervisor]
          description: Filter by the user's role in the circle
      responses:
        '200':
          description: List of circles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CircleSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createCircle
      description: |
        Create a new circle. The creator may assign existing registered users as one
        or more teachers and one optional backup supervisor. If no teacher is
        selected, the creator becomes teacher; otherwise the creator becomes
        supervisor.
      tags: [Circles]
      summary: Create a new circle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCircleRequest'
      responses:
        '201':
          description: Circle created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Circle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /circles/{circleId}:
    parameters:
      - $ref: '#/components/parameters/CircleId'
    get:
      operationId: getCircle
      description: Get circle details
      tags: [Circles]
      summary: Get circle details
      responses:
        '200':
          description: Circle details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Circle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateCircle
      description: Update circle settings (teacher only)
      tags: [Circles]
      summary: Update circle settings (teacher only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCircleRequest'
      responses:
        '200':
          description: Updated circle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Circle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteCircle
      description: Archive a circle (teacher only)
      tags: [Circles]
      summary: Archive a circle (teacher only)
      responses:
        '204':
          description: Circle archived
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /circles/{circleId}/members:
    parameters:
      - $ref: '#/components/parameters/CircleId'
    get:
      operationId: listCircleMembers
      description: List circle members
      tags: [Circles]
      summary: List circle members
      responses:
        '200':
          description: Circle members
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CircleMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /circles/{circleId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/CircleId'
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: removeCircleMember
      description: Remove a member from the circle (teacher only)
      tags: [Circles]
      summary: Remove a member from the circle (teacher only)
      responses:
        '204':
          description: Member removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /circles/{circleId}/members/{userId}/role:
    parameters:
      - $ref: '#/components/parameters/CircleId'
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateCircleMemberRole
      description: |
        An active teacher or supervisor may update another active member to student,
        supervisor, or teacher. The actor cannot change their own role, this endpoint
        cannot leave the circle without a teacher, and it never changes a role in
        another circle.
      tags: [Circles]
      summary: Manage another circle member's role (teacher or supervisor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignCircleRoleRequest'
      responses:
        '200':
          description: Role updated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /circles/join:
    post:
      operationId: joinCircle
      description: Join a circle using an invite code
      tags: [Circles]
      summary: Join a circle using an invite code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_code]
              properties:
                invite_code:
                  type: string
                  pattern: '^HLQ-[A-HJ-NP-Z2-9]{6}$'
                  example: HLQ-7X2K9Z
      responses:
        '200':
          description: Joined the circle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Circle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Invite code not found or expired
        '409':
          description: User is already a member

  # ── Sessions ──────────────────────────────────────────────
  /circles/{circleId}/sessions:
    parameters:
      - $ref: '#/components/parameters/CircleId'
    get:
      operationId: listCircleSessions
      description: List sessions for a circle
      tags: [Sessions]
      summary: List sessions for a circle
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [scheduled, active, ended]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
          description: Pagination cursor (opaque, from previous response)
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSessions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createCircleSession
      description: Create a new session (teacher only)
      tags: [Sessions]
      summary: Create a new session (teacher only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /sessions/{sessionId}/start:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: startSession
      description: Start a session — creates LiveKit room and returns token (teacher only)
      tags: [Sessions]
      summary: Start a session — creates LiveKit room and returns token (teacher only)
      responses:
        '200':
          description: Session started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStartResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Session already started

  /sessions/{sessionId}/join:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: joinSession
      description: Join an active session — returns LiveKit token (members only)
      tags: [Sessions]
      summary: Join an active session — returns LiveKit token (members only)
      responses:
        '200':
          description: LiveKit token for this session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionJoinResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Session is not active

  /sessions/{sessionId}/end:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: endSession
      description: End a session (teacher only)
      tags: [Sessions]
      summary: End a session (teacher only)
      responses:
        '200':
          description: Session ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Queue ─────────────────────────────────────────────────
  /sessions/{sessionId}/queue:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getSessionQueue
      description: Get current queue state
      tags: [Queue]
      summary: Get current queue state
      responses:
        '200':
          description: Full queue snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sessions/{sessionId}/queue/rounds:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: createQueueRound
      description: Start a new recitation round (teacher/supervisor only)
      tags: [Queue]
      summary: Start a new recitation round (teacher/supervisor only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRoundRequest'
      responses:
        '201':
          description: Round started, queue populated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Invalid Ayah range (e.g., to_ayah exceeds Surah length)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /sessions/{sessionId}/queue/entries/{entryId}/grade:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - name: entryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: gradeQueueEntry
      description: Submit grade for a completed recitation turn (teacher/supervisor only)
      tags: [Queue]
      summary: Submit grade for a completed recitation turn (teacher/supervisor only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeRequest'
      responses:
        '200':
          description: Grade recorded
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Entry is not in a gradeable state

  /sessions/{sessionId}/queue/opt-out:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: optOutOfQueue
      description: Opt out of the current round (student only, requires teacher/supervisor approval)
      tags: [Queue]
      summary: Opt out of the current round (student only, requires teacher/supervisor approval)
      responses:
        '200':
          description: Opt-out recorded; entry status set to opted_out
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: No active round or user is not in the queue

  # ── Chat ──────────────────────────────────────────────────
  /circles/{circleId}/messages:
    parameters:
      - $ref: '#/components/parameters/CircleId'
    get:
      operationId: listCircleMessages
      description: List recent messages in a circle chat
      tags: [Chat]
      summary: List recent messages in a circle chat
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: before
          in: query
          schema:
            type: string
            format: uuid
          description: Return messages before this message ID (for pagination)
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMessages'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: sendCircleMessage
      description: Send a text, image, or file message to circle chat
      tags: [Chat]
      summary: Send a text, image, or file message to circle chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /circles/{circleId}/messages/{messageId}:
    parameters:
      - $ref: '#/components/parameters/CircleId'
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteCircleMessage
      description: Delete a message (own messages within 10 min; teacher can delete any)
      tags: [Chat]
      summary: Delete a message (own messages within 10 min; teacher can delete any)
      responses:
        '204':
          description: Message deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Message is older than 10 minutes (for non-teacher users)

  # ── Schedules ─────────────────────────────────────────────
  /circles/{circleId}/schedules:
    parameters:
      - $ref: '#/components/parameters/CircleId'
    get:
      operationId: listCircleSchedules
      description: List schedules for a circle
      tags: [Schedules]
      summary: List schedules for a circle
      responses:
        '200':
          description: Schedules
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Schedule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createCircleSchedule
      description: Create a recurring schedule entry (teacher only)
      tags: [Schedules]
      summary: Create a recurring schedule entry (teacher only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleRequest'
      responses:
        '201':
          description: Schedule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ── Progress (F-007) ──────────────────────────────────────
  /students/me/circles/history:
    get:
      operationId: getMyCirclesHistory
      tags: [Progress]
      summary: Get student's circle history with attendance and practice counts
      description: |
        Returns a paginated list of all circles the authenticated student has attended,
        with per-circle statistics. **Attended vs Practiced:** "practiced" means the student
        had at least one `completed` recitation queue entry in that session. `skipped` and
        `opted_out` turns do NOT count as practiced.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque pagination cursor from previous response
        - name: active_only
          in: query
          schema: { type: boolean, default: false }
          description: Only return circles where student is still an active member
      responses:
        '200':
          description: Paginated circle history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CircleHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /students/me/progress:
    get:
      operationId: getMyProgress
      tags: [Progress]
      summary: Get student's global Quran map — all 114 Surahs with memorization status
      description: |
        Returns memorization status for all 114 Surahs derived from the student's recitation
        history across all circles. Pass `circle_id` to filter to one circle.

        **Status values:** `memorized` · `in_revision` · `needs_recap` · `in_progress` · `not_started`

        `is_stale: true` is set on `memorized` Surahs with no revision in the last 30 days.

        **Long Surahs** (e.g., Al-Baqarah): `segments` array shows each recited Ayah range
        with its grade. `coverage_pct` is the union of all ranges (no double-counting).

        **Cross-circle conflict:** Most recent update across all circles wins for global status.
      parameters:
        - name: circle_id
          in: query
          schema: { type: string, format: uuid }
          description: Filter to one circle (live query; bypasses cached mat-view)
      responses:
        '200':
          description: 114-Surah Quran map
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProgress'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /students/me/sessions/history:
    get:
      operationId: getMySessionsHistory
      description: Get student's session history with attended vs practiced breakdown
      tags: [Progress]
      summary: Get student's session history with attended vs practiced breakdown
      parameters:
        - name: circle_id
          in: query
          schema: { type: string, format: uuid }
        - name: practiced_only
          in: query
          schema: { type: boolean, default: false }
          description: Only sessions where student had at least one completed turn
        - name: from_date
          in: query
          schema: { type: string, format: date }
        - name: to_date
          in: query
          schema: { type: string, format: date }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Paginated session history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /students/me/progress/stats:
    get:
      operationId: getMyProgressStats
      description: Get student's progress analytics — Ayahs per time bucket, attendance %, practice %
      tags: [Progress]
      summary: Get student's progress analytics — Ayahs per time bucket, attendance %, practice %
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [week, month, year]
            default: month
        - name: circle_id
          in: query
          schema: { type: string, format: uuid }
        - name: from_date
          in: query
          schema: { type: string, format: date }
        - name: to_date
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Aggregated progress statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressStats'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /circles/{circleId}/progress:
    parameters:
      - $ref: '#/components/parameters/CircleId'
    get:
      operationId: getCircleProgress
      tags: [Progress]
      summary: Get all students' progress summary in a circle (teacher/supervisor only)
      description: |
        Returns a summary row per student: attendance %, practice %, last practiced date,
        active Surahs, and a `needs_attention_flag` for students who attended ≥7 consecutive
        sessions without any completed recitation turn.
      responses:
        '200':
          description: Per-student progress summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CircleProgressSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /circles/{circleId}/progress/{userId}:
    parameters:
      - $ref: '#/components/parameters/CircleId'
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getCircleUserProgress
      tags: [Progress]
      summary: Get one student's full progress profile (teacher only)
      description: |
        Returns the full progress profile for a student including their cross-circle Quran map.
        Teacher must manage at least one circle that the student belongs to.
        Teacher can see progress from ALL the student's circles (not restricted to path circle).
      responses:
        '200':
          description: Full student progress profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProgress'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /circles/{circleId}/surah-insights:
    parameters:
      - $ref: '#/components/parameters/CircleId'
    get:
      operationId: getCircleSurahInsights
      tags: [Progress]
      summary: Get Surahs ranked by weak grade frequency — last N days (teacher only)
      description: |
        Returns Surahs practiced in this circle ranked by count of `needs_review` + `repeat`
        grades in the lookback window. Helps teachers identify which Surahs need more
        revision rounds.
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 7
            maximum: 365
            default: 30
      responses:
        '200':
          description: Surahs ranked by weak grade frequency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurahInsights'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Uploads ───────────────────────────────────────────────
  /uploads/avatar:
    post:
      operationId: uploadAvatar
      tags: [Uploads]
      summary: Upload user avatar image
      description: |
        Accepts `multipart/form-data` with a single `file` field. Stores the
        image in MinIO and returns a pre-signed URL. The caller must then pass
        this URL as `avatar_url` in `PUT /auth/me`.

        Accepted MIME types: `image/jpeg`, `image/png`, `image/webp`.
        Maximum file size: 5 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Upload successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: File exceeds the 5 MB size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /uploads/voice:
    post:
      operationId: uploadVoice
      tags: [Uploads]
      summary: Upload a voice note attachment
      description: |
        Accepts `multipart/form-data` with a single `file` field. Stores the
        audio in MinIO and returns the object key. Pass the key as `media_key`
        when calling `POST /circles/{circleId}/messages` with
        `message_type: voice`.

        Accepted MIME types: `audio/ogg`, `audio/mpeg`, `audio/mp4`, `audio/webm`.
        Maximum duration: 5 minutes (300 s). Maximum file size: 20 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Upload successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: File exceeds the 20 MB size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: MIME type not accepted or duration exceeds 5 minutes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /uploads/image:
    post:
      operationId: uploadImage
      tags: [Uploads]
      summary: Upload an image attachment for circle chat
      description: |
        Accepts `multipart/form-data`. Returns the MinIO object key to pass as
        `media_key` in `POST /circles/{circleId}/messages` with
        `message_type: image`.

        Accepted MIME types: `image/jpeg`, `image/png`, `image/webp`, `image/gif`.
        Maximum file size: 20 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Upload successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: File exceeds the 20 MB size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: MIME type not accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /uploads/file:
    post:
      operationId: uploadFile
      tags: [Uploads]
      summary: Upload a file attachment (PDF) for circle chat
      description: |
        Accepts `multipart/form-data`. Returns the MinIO object key to pass as
        `media_key` in `POST /circles/{circleId}/messages` with
        `message_type: file`.

        Accepted MIME types: `application/pdf`.
        Maximum file size: 20 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Upload successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: File exceeds the 20 MB size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: MIME type not accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  # ── Config ────────────────────────────────────────────────
  /config/features:
    get:
      operationId: getFeatureConfig
      tags: [Config]
      summary: Get feature flags for the authenticated user
      description: |
        Returns the set of feature flags active for the authenticated user.
        Flutter clients fetch this at startup and store the result in a
        `featuresProvider` (Riverpod). All feature-gated UI watches this
        provider — the app never reads environment variables directly.

        Per-tier filtering is applied server-side: a flag may be globally
        enabled but returned as `false` for a user whose tier does not include
        that feature.
      responses:
        '200':
          description: Active feature flags for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlags'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── WebSocket token ───────────────────────────────────────
  /sessions/{sessionId}/ws-token:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: getSessionWebSocketToken
      tags: [Sessions]
      summary: Issue a short-lived WebSocket connection token
      description: |
        Issues a short-lived token (valid for 60 seconds) used to authenticate
        the persistent WebSocket connection. The client connects to
        `wss://api.halaqaty.app/ws?token=<ws_token>` immediately after
        receiving this token.

        The WS token encodes the user ID and their circle memberships so the
        server can register the client into the correct rooms on upgrade.
      responses:
        '200':
          description: Short-lived WebSocket token
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at]
                properties:
                  token:
                    type: string
                    description: Opaque WS auth token (valid for 60 seconds)
                  expires_at:
                    type: string
                    format: date-time
                    description: UTC expiry time of the token
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

# ─────────────────────────────────────────────────────────────
# Components
# ─────────────────────────────────────────────────────────────
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase JWT
    SessionId:
      type: apiKey
      in: header
      name: X-Halaqaty-Session-ID
      description: Opaque backend-issued identifier for the current device session.

  parameters:
    CircleId:
      name: circleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request body or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid, expired, or revoked Firebase ID token or backend session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated user lacks required role for this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    # ── Users ──────────────────────────────────────────────
    RegisterRequest:
      type: object
      required: [display_name]
      properties:
        display_name:
          type: string
          minLength: 2
          maxLength: 100
        preferred_language:
          type: string
          enum: [ar, en]
          default: ar

    CreateBackendSessionRequest:
      type: object
      properties:
        device_name:
          type: string
          maxLength: 100
          description: Optional user-visible device label; not a credential.

    BackendSessionResponse:
      type: object
      required: [session_id, expires_at, user]
      properties:
        session_id:
          type: string
          format: uuid
          description: Opaque identifier supplied in X-Halaqaty-Session-ID on subsequent requests.
        expires_at:
          type: string
          format: date-time
          description: Absolute backend-session expiry; sessions also expire after 30 days of inactivity.
        user:
          $ref: '#/components/schemas/UserProfile'

    UpdateProfileRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 150
        display_name:
          type: string
          minLength: 2
          maxLength: 100
        bio:
          type: string
          maxLength: 500
        country:
          type: string
          minLength: 2
          maxLength: 2
        preferred_language:
          type: string
          enum: [ar, en]
        avatar_url:
          type: string
          format: uri
          description: Pre-signed MinIO URL returned by the upload endpoint
        phone:
          type: string
          nullable: true
          maxLength: 50

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firebase_uid:
          type: string
        full_name:
          type: string
          nullable: true
        display_name:
          type: string
        bio:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        preferred_language:
          type: string
          enum: [ar, en]
        phone:
          type: string
          nullable: true
          maxLength: 50
        created_at:
          type: string
          format: date-time

    # ── Circles ────────────────────────────────────────────
    CreateCircleRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 500
        rules:
          type: string
          maxLength: 1000
        max_capacity:
          type: integer
          minimum: 2
          maximum: 200
          default: 50
        is_private:
          type: boolean
          default: false
        gender_restriction:
          type: string
          enum: [male, female, mixed, unspecified]
          default: unspecified
        language:
          type: string
          default: ar
        grading_policy:
          type: string
          enum: [required, optional]
          default: required
        teacher_user_ids:
          type: array
          description: Existing registered users to add as teachers. If omitted or empty, the creator becomes teacher.
          items:
            type: string
            format: uuid
          uniqueItems: true
        backup_supervisor_user_id:
          type: string
          format: uuid
          description: Optional existing registered user to add as supervisor. Must not also be a selected teacher.

    UpdateCircleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 500
        rules:
          type: string
          maxLength: 1000
        max_capacity:
          type: integer
          minimum: 2
          maximum: 200
        is_private:
          type: boolean
        gender_restriction:
          type: string
          enum: [male, female, mixed, unspecified]
        language:
          type: string
        grading_policy:
          type: string
          enum: [required, optional]

    CircleSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        member_count:
          type: integer
        my_role:
          type: string
          enum: [teacher, student, supervisor]
        is_private:
          type: boolean
        is_archived:
          type: boolean

    Circle:
      allOf:
        - $ref: '#/components/schemas/CircleSummary'
        - type: object
          properties:
            description:
              type: string
              nullable: true
            rules:
              type: string
              nullable: true
            invite_code:
              type: string
            max_capacity:
              type: integer
            gender_restriction:
              type: string
              enum: [male, female, mixed, unspecified]
            language:
              type: string
            grading_policy:
              type: string
              enum: [required, optional]
            created_at:
              type: string
              format: date-time

    CircleMember:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        avatar_url:
          type: string
          nullable: true
        role:
          type: string
          enum: [teacher, student, supervisor]
        joined_at:
          type: string
          format: date-time

    AssignCircleRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [student, supervisor, teacher]

    # ── Sessions ───────────────────────────────────────────
    CreateSessionRequest:
      type: object
      properties:
        notes:
          type: string
          maxLength: 500
        scheduled_at:
          type: string
          format: date-time
          description: Optional — if null, session is ad-hoc

    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        circle_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [scheduled, active, ended]
        created_by:
          type: string
          format: uuid
        livekit_room_name:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true
        participant_count:
          type: integer

    SessionStartResponse:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/Session'
        livekit_url:
          type: string
          format: uri
        livekit_token:
          type: string
          description: LiveKit room JWT for this user

    SessionJoinResponse:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/Session'
        livekit_url:
          type: string
          format: uri
        livekit_token:
          type: string

    PaginatedSessions:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        next_cursor:
          type: string
          nullable: true

    # ── Queue ──────────────────────────────────────────────
    StartRoundRequest:
      type: object
      required: [surah_id, from_ayah, to_ayah]
      properties:
        surah_id:
          type: integer
          minimum: 1
          maximum: 114
          description: Surah number (1–114)
        from_ayah:
          type: integer
          minimum: 1
        to_ayah:
          type: integer
          minimum: 1
          description: Validated against quran_surahs.ayah_count; returns 422 if exceeded
        grading_required:
          type: boolean
          description: Override circle's default grading_policy for this round
        student_order:
          type: array
          items:
            type: string
            format: uuid
          description: Optional pre-defined student order; defaults to join order

    GradeRequest:
      type: object
      required: [grade]
      properties:
        grade:
          type: string
          enum: [excellent, good, acceptable, needs_review, repeat]
          description: |
            5-grade recitation scale (locked 2026-06-30):
            - `excellent` — ممتاز: Perfect recitation, excellent tajweed
            - `good` — جيد: Minor errors, good tajweed
            - `acceptable` — مقبول: Notable errors, basic tajweed
            - `needs_review` — يحتاج مراجعة: Significant errors; review required
            - `repeat` — إعادة: Must fully repeat; cannot advance
        notes:
          type: string
          maxLength: 500

    QueueEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        student_name:
          type: string
        position:
          type: integer
        status:
          type: string
          enum: [waiting, reciting, completed, skipped, opted_out]
        surah_id:
          type: integer
        from_ayah:
          type: integer
        to_ayah:
          type: integer
        grade:
          type: string
          enum: [excellent, good, acceptable, needs_review, repeat]
          nullable: true
        grade_notes:
          type: string
          nullable: true

    QueueState:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        round_number:
          type: integer
        status:
          type: string
          enum: [active, paused, ended]
        surah_id:
          type: integer
          nullable: true
        from_ayah:
          type: integer
          nullable: true
        to_ayah:
          type: integer
          nullable: true
        grading_required:
          type: boolean
        entries:
          type: array
          items:
            $ref: '#/components/schemas/QueueEntry'

    # ── Chat ───────────────────────────────────────────────
    SendMessageRequest:
      type: object
      required: [message_type]
      properties:
        message_type:
          type: string
          enum: [text, image, file, voice]
        content:
          type: string
          maxLength: 4000
          description: Required for message_type=text
        media_key:
          type: string
          description: Required for image/file/voice — MinIO object key from upload endpoint
        reply_to_id:
          type: string
          format: uuid
          nullable: true

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        circle_id:
          type: string
          format: uuid
          nullable: true
        dm_recipient_id:
          type: string
          format: uuid
          nullable: true
        sender_id:
          type: string
          format: uuid
        sender_name:
          type: string
        message_type:
          type: string
          enum: [text, image, file, voice]
        content:
          type: string
          nullable: true
        media_url:
          type: string
          nullable: true
          description: Pre-signed MinIO URL (expires in 7 days)
        reply_to_id:
          type: string
          format: uuid
          nullable: true
        sent_at:
          type: string
          format: date-time

    PaginatedMessages:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        has_more:
          type: boolean

    # ── Schedules ──────────────────────────────────────────
    CreateScheduleRequest:
      type: object
      required: [day_of_week, start_time, end_time, timezone]
      properties:
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = Sunday, 6 = Saturday
        start_time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Local time in HH:MM format (interpreted using timezone)
          example: "20:00"
        end_time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: "21:30"
        timezone:
          type: string
          description: IANA timezone string
          example: Asia/Riyadh
        is_recurring:
          type: boolean
          default: true

    Schedule:
      allOf:
        - $ref: '#/components/schemas/CreateScheduleRequest'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            circle_id:
              type: string
              format: uuid
            next_occurrence:
              type: string
              format: date-time
              description: UTC datetime of the next occurrence

    # ── Progress (F-007) ───────────────────────────────────

    GradeEnum:
      type: string
      enum: [excellent, good, acceptable, needs_review, repeat]
      description: |
        5-grade recitation scale:
        - `excellent` — ممتاز
        - `good` — جيد
        - `acceptable` — مقبول
        - `needs_review` — يحتاج مراجعة
        - `repeat` — إعادة

    SurahStatusEnum:
      type: string
      enum: [memorized, in_revision, needs_recap, in_progress, not_started]
      description: |
        Memorization status for a Surah:
        - `memorized` — محفوظ: new_memorization record with excellent/good grade
        - `in_revision` — قيد المراجعة: revision or old_revision record
        - `needs_recap` — يحتاج مراجعة: latest grade is needs_review or repeat
        - `in_progress` — جزئي: has records but none match above criteria
        - `not_started` — لم يُبدأ: no records

    SurahSegment:
      type: object
      description: A single recited Ayah range within a Surah
      properties:
        from_ayah:
          type: integer
        to_ayah:
          type: integer
        grade:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/GradeEnum'
        type:
          type: string
          enum: [new_memorization, revision, old_revision]
        rub_number:
          type: integer
          nullable: true
          description: Medina Mushaf Rub' number (1–240) for this segment

    SurahStatusEntry:
      type: object
      properties:
        surah_id:
          type: integer
          minimum: 1
          maximum: 114
        name_arabic:
          type: string
          example: الفاتحة
        name_transliterated:
          type: string
          example: Al-Fatihah
        ayah_count:
          type: integer
        juz_start:
          type: integer
        status:
          $ref: '#/components/schemas/SurahStatusEnum'
        is_stale:
          type: boolean
          description: True when status=memorized AND no revision in last 30 days
        days_since_revision:
          type: integer
          nullable: true
          description: Days since last recitation of any type for this Surah
        latest_grade:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/GradeEnum'
        latest_type:
          type: string
          enum: [new_memorization, revision, old_revision]
          nullable: true
        last_practiced_date:
          type: string
          format: date
          nullable: true
        total_sessions:
          type: integer
          description: Total number of completed recitation turns for this Surah
        coverage_pct:
          type: number
          format: float
          description: Percentage of Surah Ayahs covered (union of all recited ranges)
        ayahs_covered:
          type: integer
          nullable: true
          description: Distinct Ayahs covered (union of all ranges)
        segments:
          type: array
          items:
            $ref: '#/components/schemas/SurahSegment'
          description: Non-empty only for Surahs with multiple distinct recited ranges

    StudentProgress:
      type: object
      properties:
        student_id:
          type: string
          format: uuid
        last_computed_at:
          type: string
          format: date-time
          description: When the global mat-view was last refreshed (null for per-circle live queries)
          nullable: true
        filter:
          type: object
          properties:
            circle_id:
              type: string
              format: uuid
              nullable: true
        summary:
          type: object
          properties:
            memorized_count:
              type: integer
            in_revision_count:
              type: integer
            needs_recap_count:
              type: integer
            in_progress_count:
              type: integer
            not_started_count:
              type: integer
        surahs:
          type: array
          items:
            $ref: '#/components/schemas/SurahStatusEntry'
          description: Always 114 items ordered by surah_id

    CircleHistoryItem:
      type: object
      properties:
        circle_id:
          type: string
          format: uuid
        circle_name:
          type: string
        my_role:
          type: string
          enum: [student, supervisor]
        joined_at:
          type: string
          format: date-time
        is_active_member:
          type: boolean
        sessions_attended:
          type: integer
        sessions_practiced:
          type: integer
        sessions_attended_only:
          type: integer
          description: Sessions attended but without any completed recitation turn
        total_completed_turns:
          type: integer
        last_session_date:
          type: string
          format: date-time
          nullable: true
        overall_avg_grade:
          type: number
          format: float
          nullable: true
          description: Numeric average (5=excellent, 4=good, 3=acceptable, 2=needs_review, 1=repeat)

    CircleHistoryResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CircleHistoryItem'
        next_cursor:
          type: string
          nullable: true
        total_circles:
          type: integer

    SessionTurn:
      type: object
      description: One completed recitation turn within a session
      properties:
        queue_entry_id:
          type: string
          format: uuid
        surah_id:
          type: integer
        surah_name_arabic:
          type: string
        surah_name_transliterated:
          type: string
        from_ayah:
          type: integer
        to_ayah:
          type: integer
        round_type:
          type: string
          enum: [new_memorization, revision, old_revision, test]
        grade:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/GradeEnum'
        grade_label:
          type: string
          description: Arabic grade label (e.g., ممتاز)
          nullable: true
        teacher_notes:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true

    SessionHistoryItem:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        circle_id:
          type: string
          format: uuid
        circle_name:
          type: string
        session_date:
          type: string
          format: date-time
        session_end:
          type: string
          format: date-time
          nullable: true
        attendance_status:
          type: string
          enum: [present, late, absent, excused]
        practiced:
          type: boolean
          description: True if student had at least one completed turn in this session
        completed_turns:
          type: integer
        skipped_turns:
          type: integer
        opted_out_turns:
          type: integer
        avg_grade:
          type: number
          format: float
          nullable: true
        turns:
          type: array
          items:
            $ref: '#/components/schemas/SessionTurn'

    SessionHistoryResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SessionHistoryItem'
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean

    ProgressStatsBucket:
      type: object
      properties:
        bucket_start:
          type: string
          format: date
        ayahs_recited:
          type: integer
        sessions_attended:
          type: integer
        sessions_practiced:
          type: integer
        completed_turns:
          type: integer
        avg_grade:
          type: number
          format: float
          nullable: true

    ProgressStats:
      type: object
      properties:
        period:
          type: string
          enum: [week, month, year]
        from_date:
          type: string
          format: date
        to_date:
          type: string
          format: date
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/ProgressStatsBucket'
        totals:
          $ref: '#/components/schemas/ProgressStatsBucket'

    StudentProgressSummary:
      type: object
      description: Per-student summary row in the teacher circle progress view
      properties:
        student_id:
          type: string
          format: uuid
        display_name:
          type: string
        avatar_url:
          type: string
          nullable: true
        attendance_pct:
          type: number
          format: float
          description: Sessions attended / total circle sessions (last 30 days)
        practice_pct:
          type: number
          format: float
          description: Sessions practiced / sessions attended (last 30 days)
        last_practiced_date:
          type: string
          format: date
          nullable: true
        needs_attention_flag:
          type: boolean
          description: True when student attended ≥7 consecutive sessions with no completed turn
        consecutive_attended_no_recitation:
          type: integer
          description: Current streak of attended-but-not-practiced sessions
        active_surahs:
          type: array
          items:
            type: object
            properties:
              surah_id:
                type: integer
              name_arabic:
                type: string
              status:
                $ref: '#/components/schemas/SurahStatusEnum'

    CircleProgressSummary:
      type: object
      properties:
        circle_id:
          type: string
          format: uuid
        data:
          type: array
          items:
            $ref: '#/components/schemas/StudentProgressSummary'

    SurahInsightItem:
      type: object
      properties:
        surah_id:
          type: integer
        name_arabic:
          type: string
        ayah_count:
          type: integer
        weak_grade_count:
          type: integer
          description: Count of needs_review + repeat grades in the period
        student_count:
          type: integer
          description: Number of distinct students who had weak grades on this Surah
        most_common_grade:
          $ref: '#/components/schemas/GradeEnum'

    SurahInsights:
      type: object
      properties:
        circle_id:
          type: string
          format: uuid
        period_days:
          type: integer
        insights:
          type: array
          items:
            $ref: '#/components/schemas/SurahInsightItem'

    # ── Errors ─────────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error code
              example: ERR_FORBIDDEN
            message:
              type: string
              description: Human-readable description

    ValidationError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: ERR_VALIDATION_FAILED
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string

    # ── Config ─────────────────────────────────────────────
    FeatureFlags:
      type: object
      required: [recording, video, ai_tajweed, analytics, web]
      properties:
        recording:
          type: boolean
          description: Whether session recording is enabled (default false — requires privacy framework)
        video:
          type: boolean
          description: Whether video publishing is enabled in LiveKit sessions (default false)
        ai_tajweed:
          type: boolean
          description: Whether AI Tajweed analysis is enabled (default false — requires recording to be enabled first)
        analytics:
          type: boolean
          description: Whether advanced analytics dashboards are enabled (default false)
        web:
          type: boolean
          description: Whether Flutter Web platform is enabled (default false)

    # ── Uploads ────────────────────────────────────────────
    UploadResponse:
      type: object
      required: [object_key, url]
      properties:
        object_key:
          type: string
          description: MinIO object key — pass as `media_key` in message requests
        url:
          type: string
          format: uri
          description: Pre-signed MinIO URL (expires in 7 days) — use directly for display or as `avatar_url`
