name: Tests (Unit & Integration)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  detect-test-targets:
    runs-on: ubuntu-latest
    outputs:
      go_enabled: ${{ steps.detect.outputs.go_enabled }}
      flutter_enabled: ${{ steps.detect.outputs.flutter_enabled }}
      flutter_unit_enabled: ${{ steps.detect.outputs.flutter_unit_enabled }}
      flutter_integration_enabled: ${{ steps.detect.outputs.flutter_integration_enabled }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect available stacks and test folders
        id: detect
        shell: bash
        run: |
          # Monorepo layout: backend/go.mod, mobile/pubspec.yaml
          if [[ -f "backend/go.mod" ]]; then
            echo "go_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "go_enabled=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -f "mobile/pubspec.yaml" ]]; then
            echo "flutter_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "flutter_enabled=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -d "mobile/test" ]]; then
            echo "flutter_unit_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "flutter_unit_enabled=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -d "mobile/integration_test" ]]; then
            echo "flutter_integration_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "flutter_integration_enabled=false" >> "$GITHUB_OUTPUT"
          fi

  go-unit-tests:
    needs: detect-test-targets
    if: needs.detect-test-targets.outputs.go_enabled == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run Go unit tests
        run: go test -short ./...

  go-integration-tests:
    needs: detect-test-targets
    if: needs.detect-test-targets.outputs.go_enabled == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: halaqaty
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d halaqaty"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/halaqaty?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run Go integration tests
        run: go test -tags=integration ./...

  flutter-unit-tests:
    needs: detect-test-targets
    if: needs.detect-test-targets.outputs.flutter_enabled == 'true' && needs.detect-test-targets.outputs.flutter_unit_enabled == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Run Flutter unit/widget tests
        run: flutter test test

  flutter-integration-tests:
    needs: detect-test-targets
    if: needs.detect-test-targets.outputs.flutter_enabled == 'true' && needs.detect-test-targets.outputs.flutter_integration_enabled == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux desktop dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libgtk-3-dev libblkid-dev liblzma-dev libsecret-1-dev xvfb
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Enable linux desktop test target
        run: flutter create . --platforms linux --no-pub
      - name: Run Flutter integration tests
        run: |
          status=0
          for test_file in integration_test/*_test.dart; do
            xvfb-run -a flutter test "$test_file" -d linux || status=1
          done
          exit "$status"
