name: Lint & Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-stacks:
    runs-on: ubuntu-latest
    outputs:
      go_enabled: ${{ steps.detect.outputs.go_enabled }}
      flutter_enabled: ${{ steps.detect.outputs.flutter_enabled }}
      openapi_enabled: ${{ steps.detect.outputs.openapi_enabled }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Detect available stacks
        id: detect
        shell: bash
        run: |
          if [[ -f "backend/go.mod" ]]; then
            echo "go_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "go_enabled=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -f "mobile/pubspec.yaml" ]]; then
            echo "flutter_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "flutter_enabled=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -f "docs/contracts/openapi.yaml" ]]; then
            echo "openapi_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "openapi_enabled=false" >> "$GITHUB_OUTPUT"
          fi

  go-lint:
    needs: detect-stacks
    if: needs.detect-stacks.outputs.go_enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: backend

  flutter-analyze:
    needs: detect-stacks
    if: needs.detect-stacks.outputs.flutter_enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.4
          channel: stable
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Run flutter analyze
        working-directory: mobile
        run: flutter analyze

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  api-lint:
    needs: detect-stacks
    if: needs.detect-stacks.outputs.openapi_enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli
      - name: Lint OpenAPI spec
        run: spectral lint docs/contracts/openapi.yaml
