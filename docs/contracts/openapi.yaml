  # ── Queue ─────────────────────────────────────────────────
  /sessions/{sessionId}/queue:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getSessionQueue
      description: |
        Get the PostgreSQL-authoritative current queue snapshot. Grade and note
        fields are filtered by the session queue policy. Clients re-fetch this
        operation after reconnect or a realtime version gap.
      tags: [Queue]
      summary: Get current queue state
      responses:
        '200':
          description: Full queue snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /sessions/{sessionId}/queue/rounds:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: createQueueRound
      description: |
        Prepare a round for a scheduled session or create and activate one for
        an active session (teacher/supervisor only). At most one prepared or
        active round exists per session.
      tags: [Queue]
      summary: Prepare or activate a recitation round
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRoundRequest'
      responses:
        '201':
          description: Round prepared or activated under the current session state and population policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: Invalid Ayah range (e.g., to_ayah exceeds Surah length)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /sessions/{sessionId}/queue/entries/{entryId}/grade:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - name: entryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: gradeQueueEntry
      description: |
        Correct the grade or note of a completed recitation turn when the
        session correction policy permits. Updates the existing progress record
        atomically and never creates another one.
      tags: [Queue]
      summary: Correct a completed entry grade or note
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeRequest'
      responses:
        '200':
          description: Grade recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /sessions/{sessionId}/queue/opt-out:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: optOutOfQueue
      description: |
        Student requests opt-out. The result is pending under
        `approval_required` or immediately approved under `auto_approve`.
      tags: [Queue]
      summary: Request opt-out under the session policy
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Existing idempotent opt-out request or outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptOutResult'
        '201':
          description: Opt-out request or automatic outcome created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptOutResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /sessions/{sessionId}/queue/reset:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: resetSessionQueue
      tags: [Queue]
      summary: Finalize the current round and create the next round
      description: Applies the session finalization policy, retains prior history, and creates the next sequential round atomically.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetQueueRequest'
      responses:
        '201':
          description: Prior round finalized and retained; next round created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueState'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /sessions/{sessionId}/queue/advance:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: advanceSessionQueue
      tags: [Queue]
      summary: Select the next waiting entry without starting it
      description: Durably selects the next waiting entry; a separate allowed status transition starts recitation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          description: Next entry selected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueState'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /sessions/{sessionId}/queue/order:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    put:
      operationId: reorderSessionQueue
      tags: [Queue]
      summary: Reorder waiting entries or prepared candidates
      description: Replaces the complete reorderable order using one optimistic round version.
      parameters:
