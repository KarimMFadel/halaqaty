openapi: 3.0.3
info:
  title: F-006 schedule, calendar and attendance REST contract
  version: 0.1.0
  description: Approved F-006 contract synchronized into docs/contracts/openapi.yaml. F-006 handlers are not yet implemented.
  contact:
    name: Halaqaty
servers:
  - url: /api/v1
tags:
  - name: Schedules
    description: Proposed F-006 planning, calendar and attendance surfaces
security:
  - BearerAuth: []
    SessionId: []
paths:
  /circles/{circleId}/planning-preview:
    post:
      operationId: previewCirclePlan
      summary: Preview authorized overlap warnings before a scheduling write
      description: Evaluates only commitments visible to the acting teacher or supervisor; does not save.
      tags: [Schedules]
      parameters:
        - $ref: '#/components/parameters/CircleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanInput'
      responses:
        '200':
          description: Preview of the first 31 local days or finite selected dates; later windows are evaluated when viewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarningResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /circles/{circleId}/schedules:
    get:
      operationId: listCircleSchedules
      summary: List schedules for a circle
      description: Requires current circle membership; archived circles are read-only.
      tags: [Schedules]
      parameters:
        - $ref: '#/components/parameters/CircleId'
      responses:
        '200':
          description: Authorized schedules
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Schedule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      operationId: createCircleSchedule
      summary: Create a recurrence after authorized warnings are reviewed
      description: Requires an active teacher or supervisor; a write with warnings must echo the warning IDs reviewed by the manager. New or changed warnings return 409 for renewed confirmation.
      tags: [Schedules]
      parameters:
        - $ref: '#/components/parameters/CircleId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanInput' }
      responses:
        '201':
          description: Created schedule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /circles/{circleId}/schedules/{scheduleId}:
    patch:
      operationId: changeCircleSchedule
      summary: Change or stop future occurrences with version check
      description: Supersedes unstarted exceptions in the effective range and preserves earlier history.
      tags: [Schedules]
      parameters:
        - $ref: '#/components/parameters/CircleId'
        - $ref: '#/components/parameters/ScheduleId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version, effective_local_date, plan, confirm_overlaps]
              properties:
                expected_version: { type: integer, minimum: 1 }
                effective_local_date: { type: string, format: date }
                plan: { $ref: '#/components/schemas/PlanInput' }
                stop: { type: boolean, default: false }
                confirm_overlaps: { type: boolean }
                confirmed_warning_ids: { $ref: '#/components/schemas/ConfirmedWarningIds' }
      responses:
        '200':
          description: Changed series; started/completed history preserved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /circles/{circleId}/schedules/{scheduleId}/occurrences/{localDate}:
    patch:
      operationId: changeScheduleOccurrence
      summary: Edit or cancel one unstarted occurrence
      description: Uses the original local date as stable identity, including after a move.
      tags: [Schedules]
      parameters:
        - $ref: '#/components/parameters/CircleId'
        - $ref: '#/components/parameters/ScheduleId'
        - $ref: '#/components/parameters/LocalDate'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_series_version, expected_occurrence_version, confirm_overlaps]
              properties:
                expected_series_version: { type: integer, minimum: 1 }
                expected_occurrence_version: { type: integer, minimum: 0 }
                replacement_local_date: { type: string, format: date }
                replacement_local_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
                replacement_end_local_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
                duration_minutes: { type: integer, minimum: 1, maximum: 44640 }
                title: { type: string, maxLength: 200 }
                cancelled: { type: boolean }
                confirm_overlaps: { type: boolean }
                confirmed_warning_ids: { $ref: '#/components/schemas/ConfirmedWarningIds' }
      responses:
        '200':
          description: Updated logical occurrence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /circles/{circleId}/schedules/{scheduleId}/occurrences/{localDate}/start:
    post:
      operationId: startPlannedOccurrence
      summary: Materialize and start a recurring occurrence once using F-005 start semantics
      description: Denies cancelled, ended, archived or unauthorized occurrences; an already-active replay returns 200 with a fresh caller-specific media connection and does not create a duplicate session.
      tags: [Schedules]
      parameters:
        - $ref: '#/components/parameters/CircleId'
        - $ref: '#/components/parameters/ScheduleId'
        - $ref: '#/components/parameters/LocalDate'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Existing or newly started F-005 session with caller-specific media connection; same body and no-store headers as /sessions/{sessionId}/start
          headers:
            Cache-Control: { description: Prevent credential storage, schema: { type: string, enum: [no-store] } }
            Pragma: { description: Legacy cache prevention, schema: { type: string, enum: [no-cache] } }
          content:
            application/json:
              schema: { $ref: '../../../docs/contracts/openapi.yaml#/components/schemas/SessionStartResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/MediaUnavailable' }
  /circles/{circleId}/planned-sessions:
    post:
      operationId: createOneOffPlannedSession
      summary: Create one unlinked future planned session
      description: Requires mode one_off and an active teacher or supervisor.
      tags: [Schedules]
      parameters:
        - $ref: '#/components/parameters/CircleId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanInput' }
      responses:
        '201':
          description: Created one-off calendar item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /sessions/{sessionId}/planned-details:
    patch:
      operationId: changeOneOffPlannedSession
      summary: Edit or cancel an unstarted one-off planned session
      description: Cancellation remains separate from the F-005 session status.
      tags: [Schedules]
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version, confirm_overlaps]
              properties:
                expected_version: { type: integer, minimum: 1 }
                plan: { $ref: '#/components/schemas/PlanInput' }
                cancelled: { type: boolean }
                confirm_overlaps: { type: boolean }
                confirmed_warning_ids: { $ref: '#/components/schemas/ConfirmedWarningIds' }
      responses:
        '200':
          description: Updated one-off item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /calendar/me:
    get:
      operationId: getMyCalendarMonth
      summary: Get one requested calendar month in the viewer's IANA timezone
      description: Requires current membership for each item; includes past authorized history and resolved local times.
      tags: [Schedules]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
      responses:
        '200':
          description: Eligible items and viewer-only overlap warnings; current month is the client initial request
          content:
            application/json:
              schema:
                type: object
                required: [items, warnings]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CalendarItem' }
                  warnings: { $ref: '#/components/schemas/WarningResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /sessions/{sessionId}/attendance:
    get:
      operationId: getSessionAttendance
      summary: Get completed attendance; teacher/supervisor all, student self only
      description: Revoked members are denied historical access; archived circles allow current members to read.
      tags: [Schedules]
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Role-filtered attendance
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Attendance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /sessions/{sessionId}/attendance/{userId}:
    patch:
      operationId: correctSessionAttendance
      summary: Teacher-only audited correction of one student's completed attendance
      description: Adds an append-only correction without changing F-005 presence.
      tags: [Schedules]
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status: { type: string, enum: [present, late, absent, excused] }
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          description: Corrected attendance with audit identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attendance' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
components:
  securitySchemes:
    BearerAuth: { type: http, scheme: bearer }
    SessionId: { type: apiKey, in: header, name: X-Halaqaty-Session-ID }
  parameters:
    CircleId:
      name: circleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LocalDate:
      name: localDate
      in: path
      required: true
      description: Original planned local date; stable even if occurrence is moved
      schema: { type: string, format: date }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  schemas:
    PlanInput:
      type: object
      required: [mode, anchor_local_date, local_start_time, local_end_time, duration_minutes, timezone]
      description: Server validates mode-specific selectors, nominal local end clock against positive elapsed duration, and present/future first planned instant; no future date cap
      properties:
        mode: { type: string, enum: [weekday_pattern, interval, selected_dates, one_off] }
        title: { type: string, maxLength: 200, default: Circle Session }
        anchor_local_date: { type: string, format: date }
        local_start_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        local_end_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        duration_minutes: { type: integer, minimum: 1, maximum: 44640 }
        timezone: { type: string, description: IANA timezone }
        end_local_date: { type: string, format: date, nullable: true }
        week_cadence: { type: integer, enum: [1, 2] }
        weekdays: { type: array, minItems: 1, uniqueItems: true, items: { type: integer, minimum: 0, maximum: 6 } }
        interval_count: { type: integer, minimum: 1 }
        interval_unit: { type: string, enum: [day, week] }
        selected_dates: { type: array, items: { type: string, format: date } }
        confirm_overlaps: { type: boolean, default: false, description: Relevant on writes only; true also requires all current warning IDs in confirmed_warning_ids }
        confirmed_warning_ids: { $ref: '#/components/schemas/ConfirmedWarningIds' }
    ConfirmedWarningIds:
      type: array
      uniqueItems: true
      items: { type: string, minLength: 1 }
      description: IDs of warnings actually reviewed; new or changed warnings cause 409 with refreshed warnings
    Schedule:
      type: object
      required: [id, circle_id, version, plan]
      properties:
        id: { type: string, format: uuid }
        circle_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        stopped_from_local_date: { type: string, format: date, nullable: true }
        plan: { $ref: '#/components/schemas/PlanInput' }
    CalendarItem:
      type: object
      required: [occurrence_key, circle_id, circle_name, title, starts_at, ends_at, planning_timezone, state]
      properties:
        occurrence_key: { type: string, description: 'Stable schedule UUID plus original local date, or one-off session UUID' }
        session_id: { type: string, format: uuid, nullable: true }
        circle_id: { type: string, format: uuid }
        circle_name: { type: string }
        title: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        planning_timezone: { type: string }
        state: { type: string, enum: [scheduled, active, completed, cancelled] }
        version: { type: integer, minimum: 1, nullable: true, description: 'One-off planned-session version to send as expected_version on edits; null for recurring occurrences' }
    WarningResult:
      type: object
      required: [warnings]
      properties:
        warnings:
          type: array
          items:
            type: object
            required: [warning_id, first_occurrence_key, second_occurrence_key, first_circle_name, second_circle_name, overlap_starts_at, overlap_ends_at]
            properties:
              warning_id: { type: string, description: Stable digest of occurrence identities and overlapping UTC instants for this evaluated warning }
              first_occurrence_key: { type: string }
              second_occurrence_key: { type: string }
              first_circle_name: { type: string, description: Authorized caller-visible circle name }
              second_circle_name: { type: string, description: Authorized caller-visible circle name }
              overlap_starts_at: { type: string, format: date-time, description: UTC overlap start }
              overlap_ends_at: { type: string, format: date-time, description: UTC overlap end }
    Attendance:
      type: object
      required: [session_id, user_id, status, source]
      properties:
        session_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        status: { type: string, enum: [present, late, absent, excused] }
        source: { type: string, enum: [automatic, manual] }
        first_presence_at: { type: string, format: date-time, nullable: true }
        correction_id: { type: string, format: uuid, nullable: true }
        correction:
          type: object
          nullable: true
          properties:
            actor_id: { type: string, format: uuid }
            at: { type: string, format: date-time }
            reason: { type: string }
            previous_status: { type: string, enum: [present, late, absent, excused] }
            new_status: { type: string, enum: [present, late, absent, excused] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            warnings: { $ref: '#/components/schemas/WarningResult' }
  responses:
    BadRequest: { description: Invalid syntax, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: Missing or invalid credentials, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Current circle role disallows action, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Resource unavailable to caller, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: Stale version or unconfirmed overlap; response includes current outcome and privacy-safe warnings when relevant, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unprocessable: { description: Invalid scheduling semantics, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    TooManyRequests: { description: Existing REST rate limit, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    MediaUnavailable: { description: F-005 media provider unavailable; no credential or presence mutation, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    InternalServerError: { description: Internal failure without sensitive details, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
