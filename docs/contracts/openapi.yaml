      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleRequest'
      responses:
        '201':
          description: Schedule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ── Progress (F-007) ──────────────────────────────────────
  /students/me/circles/history:
    get:
      operationId: getMyCirclesHistory
      tags: [Progress]
      summary: Get student's circle history with attendance and practice counts
      description: |
        Returns a paginated list of all circles the authenticated student has attended,
        with per-circle statistics. **Attended vs Practiced:** "practiced" means the student
        had at least one `completed` recitation queue entry in that session. `skipped` and
        `opted_out` turns do NOT count as practiced.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque pagination cursor from previous response
        - name: active_only
          in: query
          schema: { type: boolean, default: false }
          description: Only return circles where student is still an active member
      responses:
        '200':
          description: Paginated circle history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CircleHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /students/me/progress:
    get:
      operationId: getMyProgress
      tags: [Progress]
      summary: Get student's global Quran map — all 114 Surahs with memorization status
      description: |
        Returns memorization status for all 114 Surahs derived from the student's recitation
        history across all circles. Pass `circle_id` to filter to one circle.

        **Status values:** `memorized` · `in_revision` · `needs_recap` · `in_progress` · `not_started`

        `is_stale: true` is set on `memorized` Surahs with no revision in the last 30 days.

        **Long Surahs** (e.g., Al-Baqarah): `segments` array shows each recited Ayah range
        with its grade. `coverage_pct` is the union of all ranges (no double-counting).

        **Cross-circle conflict:** Most recent update across all circles wins for global status.
      parameters:
        - name: circle_id
          in: query
          schema: { type: string, format: uuid }
          description: Filter to one circle (live query; bypasses cached mat-view)
      responses:
        '200':
          description: 114-Surah Quran map
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProgress'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /students/me/sessions/history:
    get:
      operationId: getMySessionsHistory
      description: Get student's session history with attended vs practiced breakdown
      tags: [Progress]
      summary: Get student's session history with attended vs practiced breakdown
      parameters:
        - name: circle_id
          in: query
          schema: { type: string, format: uuid }
        - name: practiced_only
          in: query
          schema: { type: boolean, default: false }
          description: Only sessions where student had at least one completed turn
        - name: from_date
          in: query
          schema: { type: string, format: date }
        - name: to_date
          in: query
          schema: { type: string, format: date }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Paginated session history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /students/me/progress/stats:
    get:
      operationId: getMyProgressStats
      description: Get student's progress analytics — Ayahs per time bucket, attendance %, practice %
      tags: [Progress]
      summary: Get student's progress analytics — Ayahs per time bucket, attendance %, practice %
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [week, month, year]
            default: month
        - name: circle_id
          in: query
          schema: { type: string, format: uuid }
        - name: from_date
          in: query
          schema: { type: string, format: date }
        - name: to_date
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Aggregated progress statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressStats'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /circles/{circleId}/progress:
    parameters:
      - $ref: '#/components/parameters/CircleId'
    get:
      operationId: getCircleProgress
      tags: [Progress]
      summary: Get all students' progress summary in a circle (teacher/supervisor only)
      description: |
        Returns a summary row per student: attendance %, practice %, last practiced date,
        active Surahs, and a `needs_attention_flag` for students who attended ≥7 consecutive
        sessions without any completed recitation turn.
      responses:
        '200':
          description: Per-student progress summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CircleProgressSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /circles/{circleId}/progress/{userId}:
    parameters:
      - $ref: '#/components/parameters/CircleId'
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getCircleUserProgress
      tags: [Progress]
      summary: Get one student's full progress profile (teacher only)
      description: |
        Returns the full progress profile for a student including their cross-circle Quran map.
        Teacher must manage at least one circle that the student belongs to.
        Teacher can see progress from ALL the student's circles (not restricted to path circle).
      responses:
        '200':
          description: Full student progress profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProgress'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /circles/{circleId}/surah-insights:
    parameters:
      - $ref: '#/components/parameters/CircleId'
    get:
      operationId: getCircleSurahInsights
      tags: [Progress]
      summary: Get Surahs ranked by weak grade frequency — last N days (teacher only)
      description: |
        Returns Surahs practiced in this circle ranked by count of `needs_review` + `repeat`
        grades in the lookback window. Helps teachers identify which Surahs need more
        revision rounds.
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 7
            maximum: 365
            default: 30
      responses:
        '200':
          description: Surahs ranked by weak grade frequency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurahInsights'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Uploads ───────────────────────────────────────────────
  /uploads/avatar:
    post:
      operationId: uploadAvatar
      tags: [Uploads]
      summary: Upload user avatar image
      description: |
        Accepts `multipart/form-data` with a single `file` field. Stores the
        image in MinIO and returns a pre-signed URL. The caller must then pass
        this URL as `avatar_url` in `PUT /auth/me`.

        Accepted MIME types: `image/jpeg`, `image/png`, `image/webp`.
        Maximum file size: 5 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Upload successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: File exceeds the 5 MB size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /uploads/voice:
    post:
      operationId: uploadVoice
      tags: [Uploads]
      summary: Upload a voice note attachment
      description: |
        Accepts `multipart/form-data` with a single `file` field. Stores the
        audio in MinIO and returns the object key. Pass the key as `media_key`
        when calling `POST /circles/{circleId}/messages` with
        `message_type: voice`.

        Accepted MIME types: `audio/ogg`, `audio/mpeg`, `audio/mp4`, `audio/webm`.
        Maximum duration: 5 minutes (300 s). Maximum file size: 20 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Upload successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: File exceeds the 20 MB size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: MIME type not accepted or duration exceeds 5 minutes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /uploads/image:
    post:
      operationId: uploadImage
      tags: [Uploads]
      summary: Upload an image attachment for circle chat
      description: |
        Accepts `multipart/form-data`. Returns the MinIO object key to pass as
        `media_key` in `POST /circles/{circleId}/messages` with
        `message_type: image`.

        Accepted MIME types: `image/jpeg`, `image/png`, `image/webp`, `image/gif`.
        Maximum file size: 20 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Upload successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: File exceeds the 20 MB size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: MIME type not accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /uploads/file:
    post:
      operationId: uploadFile
      tags: [Uploads]
      summary: Upload a file attachment (PDF) for circle chat
      description: |
        Accepts `multipart/form-data`. Returns the MinIO object key to pass as
        `media_key` in `POST /circles/{circleId}/messages` with
        `message_type: file`.

        Accepted MIME types: `application/pdf`.
        Maximum file size: 20 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Upload successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: File exceeds the 20 MB size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: MIME type not accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  # ── Config ────────────────────────────────────────────────
  /config/features:
    get:
      operationId: getFeatureConfig
      tags: [Config]
      summary: Get feature flags for the authenticated user
      description: |
        Returns the set of feature flags active for the authenticated user.
        Flutter clients fetch this at startup and store the result in a
        `featuresProvider` (Riverpod). All feature-gated UI watches this
        provider — the app never reads environment variables directly.

        Per-tier filtering is applied server-side: a flag may be globally
        enabled but returned as `false` for a user whose tier does not include
        that feature.
      responses:
        '200':
          description: Active feature flags for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlags'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Realtime ticket ───────────────────────────────────────
  /realtime/tickets:
    post:
      operationId: createRealtimeTicket
      tags: [Realtime]
      summary: Issue a short-lived realtime connection ticket
      description: |
        Issues a short-lived ticket (valid for 60 seconds) used to authenticate
        the persistent WebSocket connection. The client connects to
        `wss://api.halaqaty.app/ws?token=<ticket>` immediately after receiving it.

        The ticket authorizes only the caller's current eligible circle topics.
        Session topics are added only after an authorized session join. The server
        revalidates authorization when the connection and topic subscriptions are
        established. The ticket does not grant media-room access.
      responses:
        '200':
          description: Short-lived realtime ticket; clients and intermediaries must not cache it.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at]
                properties:
                  token:
                    type: string
                    description: Opaque realtime connection ticket (valid for 60 seconds)
                  expires_at:
                    type: string
                    format: date-time
                    description: UTC expiry time of the token
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /webhooks/livekit:
    post:
      operationId: receiveLiveKitWebhook
      tags: [Sessions]
      summary: Receive a signed LiveKit webhook
      description: Verify the provider signature inside the LiveKit adapter and process valid duplicate deliveries idempotently.
      security: []
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: LiveKit webhook signature header; never a Firebase bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provider payload is verified and translated inside the LiveKit adapter; provider fields do not escape it.
      responses:
        '204':
          description: Signed webhook accepted idempotently
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

# ─────────────────────────────────────────────────────────────
# Components
# ─────────────────────────────────────────────────────────────
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase JWT
    SessionId:
      type: apiKey
      in: header
      name: X-Halaqaty-Session-ID
      description: Opaque backend-issued identifier for the current device session.

  parameters:
    CircleId:
      name: circleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional opaque retry key; reuse for a different command returns a conflict.
      schema:
        type: string
        minLength: 1
        maxLength: 128

  responses:
    BadRequest:
      description: Invalid request body or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid, expired, or revoked Firebase ID token or backend session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated user lacks required role for this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Request conflicts with the current circle state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Request rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Request failed semantic validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    ServiceUnavailable:
      description: A required external operation is temporarily unavailable; authoritative state remains recoverable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Validation:
      description: Request failed semantic validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    InternalServerError:
      description: Unexpected server failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    # ── Users ──────────────────────────────────────────────
    RegisterRequest:
      type: object
      required: [display_name]
      properties:
        display_name:
          type: string
          minLength: 2
          maxLength: 100
        preferred_language:
          type: string
          enum: [ar, en]
          default: ar

    CreateBackendSessionRequest:
      type: object
      properties:
        device_name:
          type: string
          maxLength: 100
          description: Optional user-visible device label; not a credential.

    BackendSessionResponse:
      type: object
      required: [session_id, expires_at, user]
      properties:
        session_id:
          type: string
          format: uuid
          description: Opaque identifier supplied in X-Halaqaty-Session-ID on subsequent requests.
        expires_at:
          type: string
          format: date-time
          description: Absolute backend-session expiry; sessions also expire after 30 days of inactivity.
        user:
          $ref: '#/components/schemas/UserProfile'

    UpdateProfileRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 150
        display_name:
          type: string
          minLength: 2
          maxLength: 100
        bio:
          type: string
          maxLength: 500
        country:
          type: string
          minLength: 2
          maxLength: 2
        preferred_language:
          type: string
          enum: [ar, en]
        avatar_url:
          type: string
          format: uri
          description: Pre-signed MinIO URL returned by the upload endpoint
        phone:
          type: string
          nullable: true
          maxLength: 50

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firebase_uid:
          type: string
        full_name:
          type: string
          nullable: true
        display_name:
          type: string
        bio:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        preferred_language:
          type: string
          enum: [ar, en]
        phone:
          type: string
          nullable: true
          maxLength: 50
        created_at:
          type: string
          format: date-time

    # ── Circles ────────────────────────────────────────────
    CreateCircleRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 500
          nullable: true
        rules:
          type: string
          maxLength: 1000
          nullable: true
        max_capacity:
          type: integer
          minimum: 2
          maximum: 200
          default: 50
        is_private:
          type: boolean
          default: false
        gender_restriction:
          type: string
          enum: [male, female, mixed, unspecified]
          default: unspecified
        language:
          type: string
          default: ar
        grading_policy:
          type: string
          enum: [required, optional]
          default: required
        teacher_user_ids:
          type: array
          description: Existing registered users to add as teachers. If omitted or empty, the creator becomes teacher.
          items:
            type: string
            format: uuid
          uniqueItems: true
        backup_supervisor_user_id:
          type: string
          format: uuid
          description: Optional existing registered user to add as supervisor. Must not also be a selected teacher.

    UpdateCircleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 500
          nullable: true
        rules:
          type: string
          maxLength: 1000
          nullable: true
        max_capacity:
          type: integer
          minimum: 2
          maximum: 200
        is_private:
          type: boolean
        gender_restriction:
          type: string
          enum: [male, female, mixed, unspecified]
        language:
          type: string
        grading_policy:
          type: string
          enum: [required, optional]

    CircleSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        max_capacity:
          type: integer
        gender_restriction:
          type: string
          enum: [male, female, mixed, unspecified]
        language:
          type: string
        created_at:
          type: string
          format: date-time

    Circle:
      allOf:
        - $ref: '#/components/schemas/CircleSummary'
        - type: object
          required: [invite_code, invite_link, is_archived]
          properties:
            description:
              type: string
              nullable: true
            rules:
              type: string
              nullable: true
            invite_code:
              type: string
            invite_link:
              type: string
              format: uri
            max_capacity:
              type: integer
            gender_restriction:
              type: string
              enum: [male, female, mixed, unspecified]
            language:
              type: string
            is_archived:
              type: boolean
            grading_policy:
              type: string
              enum: [required, optional]
            created_at:
              type: string
              format: date-time

    CircleMember:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        avatar_url:
          type: string
          nullable: true
        role:
          type: string
          enum: [teacher, student, supervisor]
        joined_at:
          type: string
          format: date-time

    UserSearchResult:
      type: object
      required: [id, display_name]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string

    UserSearchResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/UserSearchResult'

    InviteResponse:
      type: object
      required: [invite_code, invite_link]
      properties:
        invite_code:
          type: string
          pattern: '^HLQ-[A-HJ-NP-Z2-9]{4}$'
        invite_link:
          type: string
          format: uri

    AssignCircleRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [student, supervisor, teacher]

    # ── Sessions ───────────────────────────────────────────
    CreateSessionRequest:
      type: object
      properties:
        notes:
          type: string
          maxLength: 500
        scheduled_at:
          type: string
          format: date-time
          description: Optional. F-005 requires null/omitted; F-006 owns scheduled and recurring sessions.

    SessionLockRequest:
      type: object
      required: [locked]
      properties:
        locked:
          type: boolean
          description: True blocks new joins; eligible participants who joined before the lock may reconnect.

    Session:
      type: object
      required: [id, circle_id, status, media_mode, created_by, actual_start, actual_end, participant_count, is_locked]
      properties:
        id:
          type: string
          format: uuid
        circle_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [scheduled, active, ended]
        media_mode:
          type: string
          enum: [audio_only, audio_video]
          description: Server-controlled session media policy. MVP live sessions always return audio_only; audio_video is reserved for a future approved feature.
        created_by:
          type: string
          format: uuid
        actual_start:
          type: string
          format: date-time
          nullable: true
        actual_end:
          type: string
          format: date-time
          nullable: true
        end_reason:
          type: string
          enum: [manual, duration_limit, idle_timeout]
          nullable: true
          description: Null until the session ends; automatic endings have no human attribution.
        participant_count:
          type: integer
          minimum: 0
          maximum: 50
        is_locked:
          type: boolean
          description: Whether new joins are blocked.

    SessionStartResponse:
      type: object
      required: [session, media_connection, is_moderator]
      properties:
        session:
          $ref: '#/components/schemas/Session'
        media_connection:
          $ref: '#/components/schemas/MediaConnection'
        is_moderator:
          type: boolean

    SessionJoinResponse:
      type: object
      required: [session, media_connection, is_moderator]
      properties:
        session:
          $ref: '#/components/schemas/Session'
        media_connection:
          $ref: '#/components/schemas/MediaConnection'
        is_moderator:
          type: boolean

    SessionParticipant:
      type: object
      required: [user_id, display_name, role, is_currently_present, hand_raised_at]
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        role:
          type: string
          enum: [teacher, supervisor, student]
        is_currently_present:
          type: boolean
        hand_raised_at:
          type: string
          format: date-time
          nullable: true

    SessionParticipantsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SessionParticipant'

    MediaConnection:
      type: object
      description: Participant-specific, short-lived connection material for the session's configured media adapter. Returned only by authorized start/join operations. Never broadcast, cache, log, or persist the credential client-side.
      required: [endpoint, credential, expires_at]
      properties:
        endpoint:
          type: string
          format: uri
          pattern: '^(https|wss)://'
          description: TLS-protected media connection endpoint supplied by trusted server configuration, never by client input
        credential:
          type: string
          minLength: 1
          description: Opaque participant credential issued only to the authenticated caller
        expires_at:
          type: string
          format: date-time
          description: UTC expiration time derived from the issued credential. MVP credentials are valid for at most one hour and are renewed only through an authorized start/join operation.

    PaginatedSessions:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        next_cursor:
          type: string
          nullable: true

    # ── Queue ──────────────────────────────────────────────
    StartRoundRequest:
      type: object
      additionalProperties: false
      required: [round_type, surah_id, from_ayah, to_ayah, grading_required]
      properties:
        round_type:
          type: string
          enum: [new_memorization, revision, old_revision, test]
        surah_id:
          type: integer
          minimum: 1
          maximum: 114
          description: Surah number (1–114)
        from_ayah:
          type: integer
          minimum: 1
        to_ayah:
          type: integer
          minimum: 1
          description: Validated against quran_surahs.ayah_count; returns 422 if exceeded
        grading_required:
          type: boolean
        student_order:
          type: array
          uniqueItems: true
          maxItems: 50
          items:
            type: string
            format: uuid
          description: Optional durable pre-set student order; all IDs must be active student members

    ResetQueueRequest:
      type: object
      additionalProperties: false
      required: [round_type, surah_id, from_ayah, to_ayah, grading_required, expected_version]
      properties:
        round_type:
          type: string
          enum: [new_memorization, revision, old_revision, test]
        surah_id:
          type: integer
          minimum: 1
          maximum: 114
        from_ayah:
          type: integer
          minimum: 1
        to_ayah:
          type: integer
          minimum: 1
        grading_required:
          type: boolean
        student_order:
          type: array
          uniqueItems: true
          maxItems: 50
          items:
            type: string
            format: uuid
        expected_version:
          type: integer
          format: int64
          minimum: 1

    VersionRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 1

    ReorderQueueRequest:
      type: object
      additionalProperties: false
      required: [order_kind, ordered_ids, expected_version]
      properties:
        order_kind:
          type: string
          enum: [preorder_students, queue_entries]
        ordered_ids:
          type: array
          uniqueItems: true
          maxItems: 50
          items:
            type: string
            format: uuid
        expected_version:
          type: integer
          format: int64
          minimum: 1

    EntryStatusRequest:
      type: object
      additionalProperties: false
      required: [status, expected_entry_version]
      description: Grade is required for completed when the round requires grading; grade and notes are invalid for reciting or skipped.
      properties:
        status:
          type: string
          enum: [reciting, skipped, completed]
        expected_entry_version:
          type: integer
          format: int64
          minimum: 1
        grade:
          type: string
          enum: [excellent, good, acceptable, needs_review, repeat]
          nullable: true
        notes:
          type: string
          maxLength: 500
          nullable: true

    GradeRequest:
      type: object
      additionalProperties: false
      required: [expected_entry_version]
      minProperties: 2
      properties:
        grade:
          type: string
          enum: [excellent, good, acceptable, needs_review, repeat]
          nullable: true
          description: |
            5-grade recitation scale (locked 2026-06-30):
            - `excellent` — ممتاز: Perfect recitation, excellent tajweed
            - `good` — جيد: Minor errors, good tajweed
            - `acceptable` — مقبول: Notable errors, basic tajweed
            - `needs_review` — يحتاج مراجعة: Significant errors; review required
            - `repeat` — إعادة: Full repetition is recommended; manager controls remain available
        notes:
          type: string
          maxLength: 500
          nullable: true
        expected_entry_version:
          type: integer
          format: int64
          minimum: 1

    OptOutDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, expected_entry_version]
      properties:
        decision:
          type: string
          enum: [approved, declined]
        expected_entry_version:
          type: integer
          format: int64
          minimum: 1

    QueuePolicyPatch:
      type: object
      additionalProperties: false
      required: [expected_version]
      minProperties: 2
      properties:
        population:
          type: string
          enum: [present_at_activation, all_active_students]
        unfinished_finalization:
          type: string
          enum: [mark_unfinished_skipped, preserve_last_state]
        opt_out:
          type: string
          enum: [approval_required, auto_approve]
        grade_visibility:
          type: string
          enum: [managers_and_student, managers_only, all_participants]
        grade_correction:
          type: string
          enum: [audited_any_time, before_round_finalization, immutable]
        expected_version:
          type: integer
          format: int64
          minimum: 1

    QueuePolicy:
      type: object
      required: [population, unfinished_finalization, opt_out, grade_visibility, grade_correction, version]
      properties:
        population:
          type: string
          enum: [present_at_activation, all_active_students]
        unfinished_finalization:
          type: string
          enum: [mark_unfinished_skipped, preserve_last_state]
        opt_out:
          type: string
          enum: [approval_required, auto_approve]
        grade_visibility:
          type: string
          enum: [managers_and_student, managers_only, all_participants]
        grade_correction:
          type: string
          enum: [audited_any_time, before_round_finalization, immutable]
        version:
          type: integer
          format: int64
          minimum: 1

    QueueEntry:
      type: object
      required: [id, student_id, student_name, position, status, version]
      properties:
        id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        student_name:
          type: string
        position:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [waiting, reciting, completed, skipped, opted_out]
        grade:
          type: string
          enum: [excellent, good, acceptable, needs_review, repeat]
          nullable: true
        grade_notes:
          type: string
          maxLength: 500
          nullable: true
        version:
          type: integer
          format: int64
          minimum: 1

    QueuePreorderItem:
      type: object
      required: [student_id, student_name, position]
      properties:
        student_id:
          type: string
          format: uuid
        student_name:
          type: string
        position:
          type: integer
          minimum: 1

    QueueState:
      type: object
      required: [session_id, round_id, round_number, round_type, lifecycle, surah_id, from_ayah, to_ayah, grading_required, version, policy, preorder, entries]
      properties:
        session_id:
          type: string
          format: uuid
        round_id:
          type: string
          format: uuid
        round_number:
          type: integer
          minimum: 1
        round_type:
          type: string
          enum: [new_memorization, revision, old_revision, test]
        lifecycle:
          type: string
          enum: [prepared, active, finalized]
        surah_id:
          type: integer
          minimum: 1
          maximum: 114
        from_ayah:
          type: integer
          minimum: 1
        to_ayah:
          type: integer
          minimum: 1
        grading_required:
          type: boolean
        selected_entry_id:
          type: string
          format: uuid
          nullable: true
        version:
          type: integer
          format: int64
          minimum: 1
        policy:
          $ref: '#/components/schemas/QueuePolicy'
        preorder:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/QueuePreorderItem'
        entries:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/QueueEntry'

    OptOutRequest:
      type: object
      required: [id, queue_entry_id, status, requested_at]
      properties:
        id:
          type: string
          format: uuid
        queue_entry_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, approved, declined]
        requested_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
          nullable: true

    OptOutResult:
      type: object
      required: [request, entry]
      properties:
        request:
          $ref: '#/components/schemas/OptOutRequest'
        entry:
          $ref: '#/components/schemas/QueueEntry'

    # ── Chat ───────────────────────────────────────────────
    SendMessageRequest:
      type: object
      required: [message_type]
      properties:
        message_type:
          type: string
          enum: [text, image, file, voice]
        content:
          type: string
          maxLength: 4000
          description: Required for message_type=text
        media_key:
          type: string
          description: Required for image/file/voice — MinIO object key from upload endpoint
        reply_to_id:
          type: string
          format: uuid
          nullable: true

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        circle_id:
          type: string
          format: uuid
          nullable: true
        dm_recipient_id:
          type: string
          format: uuid
          nullable: true
        sender_id:
          type: string
          format: uuid
        sender_name:
          type: string
        message_type:
          type: string
          enum: [text, image, file, voice]
        content:
          type: string
          nullable: true
        media_url:
          type: string
          nullable: true
          description: Pre-signed MinIO URL (expires in 7 days)
        reply_to_id:
          type: string
          format: uuid
          nullable: true
        sent_at:
          type: string
          format: date-time

    PaginatedMessages:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        has_more:
          type: boolean

    # ── Schedules ──────────────────────────────────────────
    CreateScheduleRequest:
      type: object
      required: [day_of_week, start_time, end_time, timezone]
      properties:
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = Sunday, 6 = Saturday
        start_time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Local time in HH:MM format (interpreted using timezone)
          example: "20:00"
        end_time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: "21:30"
        timezone:
          type: string
          description: IANA timezone string
          example: Asia/Riyadh
        is_recurring:
          type: boolean
          default: true

    Schedule:
      allOf:
        - $ref: '#/components/schemas/CreateScheduleRequest'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            circle_id:
              type: string
              format: uuid
            next_occurrence:
              type: string
              format: date-time
              description: UTC datetime of the next occurrence

    # ── Progress (F-007) ───────────────────────────────────

    GradeEnum:
      type: string
      enum: [excellent, good, acceptable, needs_review, repeat]
      description: |
        5-grade recitation scale:
        - `excellent` — ممتاز
        - `good` — جيد
        - `acceptable` — مقبول
        - `needs_review` — يحتاج مراجعة
        - `repeat` — إعادة

    SurahStatusEnum:
      type: string
      enum: [memorized, in_revision, needs_recap, in_progress, not_started]
      description: |
        Memorization status for a Surah:
        - `memorized` — محفوظ: new_memorization record with excellent/good grade
        - `in_revision` — قيد المراجعة: revision or old_revision record
        - `needs_recap` — يحتاج مراجعة: latest grade is needs_review or repeat
        - `in_progress` — جزئي: has records but none match above criteria
        - `not_started` — لم يُبدأ: no records

    SurahSegment:
      type: object
      description: A single recited Ayah range within a Surah
      properties:
        from_ayah:
          type: integer
        to_ayah:
          type: integer
        grade:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/GradeEnum'
        type:
          type: string
          enum: [new_memorization, revision, old_revision]
        rub_number:
          type: integer
          nullable: true
          description: Medina Mushaf Rub' number (1–240) for this segment

    SurahStatusEntry:
      type: object
      properties:
        surah_id:
          type: integer
          minimum: 1
          maximum: 114
        name_arabic:
          type: string
          example: الفاتحة
        name_transliterated:
          type: string
          example: Al-Fatihah
        ayah_count:
          type: integer
        juz_start:
          type: integer
        status:
          $ref: '#/components/schemas/SurahStatusEnum'
        is_stale:
          type: boolean
          description: True when status=memorized AND no revision in last 30 days
        days_since_revision:
          type: integer
          nullable: true
          description: Days since last recitation of any type for this Surah
        latest_grade:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/GradeEnum'
        latest_type:
          type: string
          enum: [new_memorization, revision, old_revision]
          nullable: true
        last_practiced_date:
          type: string
          format: date
          nullable: true
        total_sessions:
          type: integer
          description: Total number of completed recitation turns for this Surah
        coverage_pct:
          type: number
          format: float
          description: Percentage of Surah Ayahs covered (union of all recited ranges)
        ayahs_covered:
          type: integer
          nullable: true
          description: Distinct Ayahs covered (union of all ranges)
        segments:
          type: array
          items:
            $ref: '#/components/schemas/SurahSegment'
          description: Non-empty only for Surahs with multiple distinct recited ranges

    StudentProgress:
      type: object
      properties:
        student_id:
          type: string
          format: uuid
        last_computed_at:
          type: string
          format: date-time
          description: When the global mat-view was last refreshed (null for per-circle live queries)
          nullable: true
        filter:
          type: object
          properties:
            circle_id:
              type: string
              format: uuid
              nullable: true
        summary:
          type: object
          properties:
            memorized_count:
              type: integer
            in_revision_count:
              type: integer
            needs_recap_count:
              type: integer
            in_progress_count:
              type: integer
            not_started_count:
              type: integer
        surahs:
          type: array
          items:
            $ref: '#/components/schemas/SurahStatusEntry'
          description: Always 114 items ordered by surah_id

    CircleHistoryItem:
      type: object
      properties:
        circle_id:
          type: string
          format: uuid
        circle_name:
          type: string
        my_role:
          type: string
          enum: [student, supervisor]
        joined_at:
          type: string
          format: date-time
        is_active_member:
          type: boolean
        sessions_attended:
          type: integer
        sessions_practiced:
          type: integer
        sessions_attended_only:
          type: integer
          description: Sessions attended but without any completed recitation turn
        total_completed_turns:
          type: integer
        last_session_date:
          type: string
          format: date-time
          nullable: true
        overall_avg_grade:
          type: number
          format: float
          nullable: true
          description: Numeric average (5=excellent, 4=good, 3=acceptable, 2=needs_review, 1=repeat)

    CircleHistoryResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CircleHistoryItem'
        next_cursor:
          type: string
          nullable: true
        total_circles:
          type: integer

    SessionTurn:
      type: object
      description: One completed recitation turn within a session
      properties:
        queue_entry_id:
          type: string
          format: uuid
        surah_id:
          type: integer
        surah_name_arabic:
          type: string
        surah_name_transliterated:
          type: string
        from_ayah:
          type: integer
        to_ayah:
          type: integer
        round_type:
          type: string
          enum: [new_memorization, revision, old_revision, test]
        grade:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/GradeEnum'
        grade_label:
          type: string
          description: Arabic grade label (e.g., ممتاز)
          nullable: true
        teacher_notes:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true

    SessionHistoryItem:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        circle_id:
          type: string
          format: uuid
        circle_name:
          type: string
        session_date:
          type: string
          format: date-time
        session_end:
          type: string
          format: date-time
          nullable: true
        attendance_status:
          type: string
          enum: [present, late, absent, excused]
        practiced:
          type: boolean
          description: True if student had at least one completed turn in this session
        completed_turns:
          type: integer
        skipped_turns:
          type: integer
        opted_out_turns:
          type: integer
        avg_grade:
          type: number
          format: float
          nullable: true
        turns:
          type: array
          items:
            $ref: '#/components/schemas/SessionTurn'

    SessionHistoryResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SessionHistoryItem'
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean

    ProgressStatsBucket:
      type: object
      properties:
        bucket_start:
          type: string
          format: date
        ayahs_recited:
          type: integer
        sessions_attended:
          type: integer
        sessions_practiced:
          type: integer
        completed_turns:
          type: integer
        avg_grade:
          type: number
          format: float
          nullable: true

    ProgressStats:
      type: object
      properties:
        period:
          type: string
          enum: [week, month, year]
        from_date:
          type: string
          format: date
        to_date:
          type: string
          format: date
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/ProgressStatsBucket'
        totals:
          $ref: '#/components/schemas/ProgressStatsBucket'

    StudentProgressSummary:
      type: object
      description: Per-student summary row in the teacher circle progress view
      properties:
        student_id:
          type: string
          format: uuid
        display_name:
          type: string
        avatar_url:
          type: string
          nullable: true
        attendance_pct:
          type: number
          format: float
          description: Sessions attended / total circle sessions (last 30 days)
        practice_pct:
          type: number
          format: float
          description: Sessions practiced / sessions attended (last 30 days)
        last_practiced_date:
          type: string
          format: date
          nullable: true
        needs_attention_flag:
          type: boolean
          description: True when student attended ≥7 consecutive sessions with no completed turn
        consecutive_attended_no_recitation:
          type: integer
          description: Current streak of attended-but-not-practiced sessions
        active_surahs:
          type: array
          items:
            type: object
            properties:
              surah_id:
                type: integer
              name_arabic:
                type: string
              status:
                $ref: '#/components/schemas/SurahStatusEnum'

    CircleProgressSummary:
      type: object
      properties:
        circle_id:
          type: string
          format: uuid
        data:
          type: array
          items:
            $ref: '#/components/schemas/StudentProgressSummary'

    SurahInsightItem:
      type: object
      properties:
        surah_id:
          type: integer
        name_arabic:
          type: string
        ayah_count:
          type: integer
        weak_grade_count:
          type: integer
          description: Count of needs_review + repeat grades in the period
        student_count:
          type: integer
          description: Number of distinct students who had weak grades on this Surah
        most_common_grade:
          $ref: '#/components/schemas/GradeEnum'

    SurahInsights:
      type: object
      properties:
        circle_id:
          type: string
          format: uuid
        period_days:
          type: integer
        insights:
          type: array
          items:
            $ref: '#/components/schemas/SurahInsightItem'

    # ── Errors ─────────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error code
              example: ERR_FORBIDDEN
            message:
              type: string
              description: Human-readable description

    ValidationError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: ERR_VALIDATION_FAILED
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string

    # ── Config ─────────────────────────────────────────────
    FeatureFlags:
      type: object
      required: [recording, video, ai_tajweed, analytics, web]
      properties:
        recording:
          type: boolean
          description: Whether session recording is enabled (default false — requires privacy framework)
        video:
          type: boolean
          description: Whether an approved video-session feature is enabled (default false; F-005 never enables video publishing)
        ai_tajweed:
          type: boolean
          description: Whether AI Tajweed analysis is enabled (default false — requires recording to be enabled first)
        analytics:
          type: boolean
          description: Whether advanced analytics dashboards are enabled (default false)
        web:
          type: boolean
          description: Whether Flutter Web platform is enabled (default false)

    # ── Uploads ────────────────────────────────────────────
    UploadResponse:
      type: object
      required: [object_key, url]
      properties:
        object_key:
          type: string
          description: MinIO object key — pass as `media_key` in message requests
        url:
          type: string
          format: uri
          description: Pre-signed MinIO URL (expires in 7 days) — use directly for display or as `avatar_url`
