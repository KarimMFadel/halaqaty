openapi: 3.0.3
info:
  title: Halaqaty API
  description: |
    REST API for the Halaqaty Quran memorization circle management platform.

    **Authentication:** Flutter uses Firebase Auth for sign-up, sign-in, password
    management, and ID-token refresh. API requests require a Firebase ID token in
    `Authorization: Bearer <token>` and, after backend session creation, the opaque
    current-device session identifier in `X-Halaqaty-Session-ID`. The backend never
    accepts passwords or issues Firebase ID or refresh tokens.

    **Base URL:** `https://api.halaqaty.app/api/v1`

    **WebSocket:** Real-time events (queue, session, chat) are delivered over WebSocket. See [ws_events.md](ws_events.md) for the full event catalogue.
  version: 1.0.0
  contact:
    name: Halaqaty
    url: https://halaqaty.app

servers:
  - url: https://api.halaqaty.app/api/v1
    description: Production
  - url: https://staging.api.halaqaty.app/api/v1
    description: Staging
  - url: http://localhost:8080/api/v1
    description: Local development

security:
  - BearerAuth: []
    SessionId: []

tags:
  - name: Auth
    description: User registration, profile, and device management
  - name: Circles
    description: Circle (halaqah) CRUD and membership
  - name: Users
    description: Authenticated registered-user lookup
  - name: Sessions
    description: Live session management
  - name: Realtime
    description: Authenticated WebSocket ticket issuance and topic authorization
  - name: Queue
    description: Recitation queue within a session
  - name: Chat
    description: Circle and direct messages
  - name: Schedules
    description: Weekly recurring schedules
  - name: Progress
    description: Student progress tracking — attendance history, Quran map, recitation stats (F-007)
  - name: Config
    description: Feature flags and application configuration
  - name: Uploads
    description: File uploads to MinIO (avatars, voice notes, images, PDFs)

# ─────────────────────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────────────────────
paths:

  # ── Auth ──────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: registerUser
      tags: [Auth]
      summary: Create user profile after Firebase registration
      security:
        - BearerAuth: []
      description: |
        Called after a successful Firebase Auth sign-up to provision the local user
        record and create a backend session for this device. The Firebase UID is
        derived solely from the verified bearer token; it is never accepted in the
        request body. Idempotent for the same Firebase identity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User provisioned and current-device backend session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: User already exists (idempotent — returns current session)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendSessionResponse'

  /auth/sessions:
    post:
      operationId: createBackendSession
      description: |
        Creates a backend session for the current device after the Flutter Firebase
        SDK has signed the user in. This endpoint does not validate a password,
        create Firebase identities, or return Firebase tokens. Clients must not
        automatically retry this request because each successful call creates a
        distinct backend device session.
      tags: [Auth]
      summary: Create a current-device backend session
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBackendSessionRequest'
      responses:
        '200':
          description: Current-device backend session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      operationId: logoutUser
      tags: [Auth]
      summary: Logout current session
      description: |
        Invalidates only the backend session identified by `X-Halaqaty-Session-ID`.
        Other device sessions remain valid. The Flutter client must also call
        Firebase sign-out locally; Firebase refresh-token rotation and reuse
        detection remain Firebase-managed.
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/fcm-token:
    post:
      operationId: registerFcmToken
      tags: [Auth]
      summary: Register or update a device FCM token (upsert by user_id + token)
      description: |
        Registers a new device FCM token for push notifications. Uses upsert
        semantics — if the token already exists for this user, updates `last_seen_at`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token:
                  type: string
                  description: FCM device registration token
                platform:
                  type: string
                  enum: [ios, android, web]
                device_name:
                  type: string
                  maxLength: 100
                  description: Optional human-readable device label
      responses:
        '200':
          description: Token registered or updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      operationId: getCurrentUser
      description: Get current user profile
      tags: [Auth]
      summary: Get current user profile
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: updateCurrentUser
      description: Update profile (name, avatar, language)
      tags: [Auth]
      summary: Update profile (name, avatar, language)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteCurrentUser
      tags: [Auth]
      summary: Delete account and all associated data
      description: |
        Permanently deletes the account, all circles owned by the user (archiving
        them for members), all messages sent by the user, and all progress records.
        This operation is irreversible and GDPR-compliant.
      responses:
        '204':
          description: Account deleted
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Circles ───────────────────────────────────────────────
  /circles:
    get:
      operationId: listCircles
      description: List circles the authenticated user is a member of
      tags: [Circles]
      summary: List circles the authenticated user is a member of
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [teacher, student, supervisor]
          description: Filter by the user's role in the circle
      responses:
        '200':
          description: List of circles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CircleSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createCircle
      description: |
        Create a new circle. The creator may assign existing registered users as one
        or more teachers and one optional backup supervisor. If no teacher is
        selected, the creator becomes teacher; otherwise the creator becomes
        supervisor.
      tags: [Circles]
      summary: Create a new circle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCircleRequest'
      responses:
        '201':
          description: Circle created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Circle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/search:
    get:
      operationId: searchUsers
      description: Search registered users by display name for circle-role selection.
      tags: [Users]
      summary: Search registered users
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
      responses:
        '200':
          description: Matching registered users, limited to 20 results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /circles/{circleId}:
    parameters:
      - $ref: '#/components/parameters/CircleId'
    get:
      operationId: getCircle
      description: Get circle details
      tags: [Circles]
      summary: Get circle details
      responses:
        '200':
          description: Circle details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Circle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      operationId: updateCircle
      description: Update circle settings (teacher only)
      tags: [Circles]
      summary: Update circle settings (teacher only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCircleRequest'
      responses:
        '200':
          description: Updated circle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Circle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: archiveCircle
      description: Archive a circle (teacher only). This is soft-state retirement; hard deletion is prohibited.
      tags: [Circles]
      summary: Archive a circle (teacher only)
      responses:
        '204':
          description: Circle archived
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /circles/{circleId}/join:
    parameters:
      - $ref: '#/components/parameters/CircleId'
    post:
      operationId: joinPublicCircle
      description: Join an active public circle as a student.
      tags: [Circles]
      summary: Join a public circle
      responses:
        '201':
          description: Student membership created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Circle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Circle is private, full, archived, or already joined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /circles/discover:
    get:
      operationId: discoverPublicCircles
      description: Discover active public circles using a redacted summary; private and member data are omitted.
      tags: [Circles]
      summary: Discover public circles
      parameters:
        - name: query
          in: query
          schema:
            type: string
            maxLength: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Public circle summaries
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CircleSummary'
                  next_cursor:
                    type: string
                    nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /circles/{circleId}/members:
    parameters:
      - $ref: '#/components/parameters/CircleId'
    get:
      operationId: listCircleMembers
      description: List circle members
      tags: [Circles]
      summary: List circle members
      responses:
        '200':
          description: Circle members
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CircleMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /circles/{circleId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/CircleId'
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: removeCircleMember
      description: Remove a member from the circle (teacher only)
      tags: [Circles]
      summary: Remove a member from the circle (teacher only)
      responses:
        '204':
          description: Member removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /circles/{circleId}/members/{userId}/role:
    parameters:
      - $ref: '#/components/parameters/CircleId'
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateCircleMemberRole
      description: |
        An active teacher or supervisor may update another active member to student,
        supervisor, or teacher. The actor cannot change their own role, this endpoint
        cannot leave the circle without a teacher, and it never changes a role in
        another circle.
      tags: [Circles]
      summary: Manage another circle member's role (teacher or supervisor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignCircleRoleRequest'
      responses:
        '200':
          description: Role updated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /circles/join:
    post:
      operationId: joinCircle
      description: Join a circle using an invite code
      tags: [Circles]
      summary: Join a circle using an invite code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_code]
              properties:
                invite_code:
                  type: string
                  pattern: '^HLQ-[A-HJ-NP-Z2-9]{4}$'
                  example: HLQ-7X2K
      responses:
        '200':
          description: Joined the circle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Circle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Invite code not found or expired
        '409':
          description: Circle is full or archived, the user is already a member, or the five-circle limit is reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /circles/{circleId}/invite-code/refresh:
    parameters:
      - $ref: '#/components/parameters/CircleId'
    post:
      operationId: refreshCircleInviteCode
      description: Rotate the invite code atomically; the old code is invalid immediately and hard deletion is not involved.
      tags: [Circles]
      summary: Refresh a circle invite code
      responses:
        '200':
          description: New invite code and shareable link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ── Sessions ──────────────────────────────────────────────
  /circles/{circleId}/sessions:
    parameters:
      - $ref: '#/components/parameters/CircleId'
    get:
      operationId: listCircleSessions
      description: List sessions for a circle
      tags: [Sessions]
      summary: List sessions for a circle
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [scheduled, active, ended]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
          description: Pagination cursor (opaque, from previous response)
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSessions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createCircleSession
      description: |
        Create a session. F-005 permits only ad-hoc sessions with `scheduled_at`
        omitted or null; F-006 owns scheduled and recurring session creation.
        Teachers and supervisors may create F-005 ad-hoc sessions.
      tags: [Sessions]
      summary: Create an ad-hoc session (teacher or supervisor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sessions/{sessionId}/start:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: startSession
      description: Start a session, ensure its media room, and return a participant-specific media connection (teacher or supervisor)
      tags: [Sessions]
      summary: Start a session and return the caller's media connection
      responses:
        '200':
          description: Session started, or the already-active session returned idempotently with a newly issued caller-specific media connection
          headers:
            Cache-Control:
              description: Prevent storage of participant credentials
              schema:
                type: string
                enum: [no-store]
            Pragma:
              description: Legacy cache prevention for participant credentials
              schema:
                type: string
                enum: [no-cache]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStartResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Session cannot be started from its current state, such as an ended session. Repeating start for an active session returns 200.
        '503':
          description: Session media provider is temporarily unavailable; return error code ERR_MEDIA_UNAVAILABLE without a credential or presence mutation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sessions/{sessionId}/join:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: joinSession
      description: Join an active session and return a participant-specific media connection (members only)
      tags: [Sessions]
      summary: Join an active session and return the caller's media connection
      responses:
        '200':
          description: Participant-specific media connection for this session
          headers:
            Cache-Control:
              description: Prevent storage of participant credentials
              schema:
                type: string
                enum: [no-store]
            Pragma:
              description: Legacy cache prevention for participant credentials
              schema:
                type: string
                enum: [no-cache]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionJoinResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Session is not active
        '503':
          description: Session media provider is temporarily unavailable; return error code ERR_MEDIA_UNAVAILABLE without a credential or presence mutation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sessions/{sessionId}/end:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: endSession
      description: End a session (teacher or supervisor); automatic duration and idle endings are system-attributed. Persist ended before provider close; committed end responses succeed while cleanup retries asynchronously.
      tags: [Sessions]
      summary: End a session (teacher or supervisor)
      responses:
        '200':
          description: Session ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sessions/{sessionId}/lock:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: setSessionLock
      description: Lock or unlock a session. A lock blocks new joins but permits eligible participants who joined before the lock to reconnect.
      tags: [Sessions]
      summary: Lock or unlock a session (teacher or supervisor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionLockRequest'
      responses:
        '200':
          description: Updated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sessions/{sessionId}/participants:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: listSessionParticipants
      description: Return the current presence and hand snapshot to an eligible joined participant.
      tags: [Sessions]
      summary: List current session participants
      responses:
        '200':
          description: Current participant presence snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionParticipantsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sessions/{sessionId}/participants/mute-all:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: muteAllSessionParticipants
      description: Mute active audio publishers without changing student turn entitlement (teacher or supervisor).
      tags: [Sessions]
      summary: Mute all active publishers
      responses:
        '204':
          description: Active publishers muted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sessions/{sessionId}/participants/{userId}/mute:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - in: path
        name: userId
        required: true
        schema:
          type: string
